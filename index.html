<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fexilo - HEIC to JPG Converter</title>

  <meta
    name="description"
    content="Convert HEIC to JPG online for free. High-quality, fast and private. Your files are processed in your browser."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    .container {
      max-width: 760px;
      margin: auto;
      padding: 35px 20px;
      text-align: center;
    }

    .logo {
      font-size: 32px;
      font-weight: 800;
      color: #4f46e5;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 38px;
      margin: 10px 0;
    }

    .subtitle {
      color: #6b7280;
      font-size: 17px;
      margin-bottom: 30px;
    }

    .upload-box {
      display: block;
      background: white;
      border: 2px dashed #c7d2fe;
      border-radius: 20px;
      padding: 50px 20px;
      cursor: pointer;
      transition: 0.2s;
    }

    .upload-box:hover {
      border-color: #4f46e5;
      background: #fafaff;
    }

    .upload-icon {
      font-size: 55px;
      margin-bottom: 15px;
    }

    .upload-text {
      font-size: 20px;
      font-weight: 700;
    }

    .upload-hint {
      color: #6b7280;
      margin-top: 8px;
    }

    input {
      display: none;
    }

    .settings {
      background: white;
      padding: 20px;
      border-radius: 16px;
      margin-top: 20px;
      text-align: left;
    }

    .settings label {
      font-weight: 700;
    }

    select {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      background: white;
    }

    #status {
      margin-top: 25px;
      font-weight: 600;
    }

    .result {
      display: none;
      background: white;
      margin-top: 25px;
      padding: 25px;
      border-radius: 16px;
    }

    .preview {
      width: 100%;
      max-height: 400px;
      object-fit: contain;
      border-radius: 12px;
      margin: 15px 0;
      background: #f3f4f6;
    }

    .file-info {
      color: #6b7280;
      font-size: 14px;
      margin: 10px 0;
    }

    .download {
      display: inline-block;
      margin-top: 15px;
      padding: 13px 22px;
      background: #4f46e5;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 700;
    }

    .download:hover {
      background: #4338ca;
    }

    .privacy {
      margin-top: 25px;
      color: #6b7280;
      font-size: 14px;
    }

    .footer {
      margin-top: 60px;
      color: #9ca3af;
      font-size: 13px;
    }

    .error {
      color: #dc2626;
    }

    .success {
      color: #16a34a;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 30px;
      }

      .container {
        padding-top: 30px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">Fexilo</div>

  <h1>Convert HEIC to JPG</h1>

  <p class="subtitle">
    Free, fast and private HEIC to JPG converter.
  </p>

  <label class="upload-box" for="fileInput">

    <div class="upload-icon">📷</div>

    <div class="upload-text">
      Choose HEIC file
    </div>

    <div class="upload-hint">
      Tap here to select an image
    </div>

  </label>

  <input
    id="fileInput"
    type="file"
    accept="image/*,.heic,.heif"
  >

  <div class="settings">

    <label for="quality">
      JPG Quality
    </label>

    <select id="quality">

      <option value="0.95">
        High quality — 95%
      </option>

      <option value="0.85">
        Balanced — 85%
      </option>

      <option value="0.70">
        Smaller file — 70%
      </option>

    </select>

  </div>

  <div id="status"></div>

  <div id="result" class="result">

    <div class="success">
      ✅ Conversion complete!
    </div>

    <img
      id="preview"
      class="preview"
      alt="Converted JPG preview"
    >

    <div id="fileInfo" class="file-info"></div>

    <a
      id="download"
      class="download"
      download="fexilo.jpg"
    >
      Download JPG
    </a>

  </div>

  <div class="privacy">
    🔒 Your file is processed in your browser.
  </div>

  <div class="footer">
    © 2026 Fexilo
  </div>

</div>

<script type="module">

  import {
    heicTo,
    isHeic
  } from "https://cdn.jsdelivr.net/npm/heic-to@1.5.2/+esm";

  const input = document.getElementById("fileInput");
  const qualitySelect = document.getElementById("quality");
  const status = document.getElementById("status");
  const result = document.getElementById("result");
  const preview = document.getElementById("preview");
  const download = document.getElementById("download");
  const fileInfo = document.getElementById("fileInfo");

  function formatBytes(bytes) {

    if (bytes < 1024) {
      return bytes + " B";
    }

    if (bytes < 1024 * 1024) {
      return (bytes / 1024).toFixed(1) + " KB";
    }

    return (bytes / (1024 * 1024)).toFixed(2) + " MB";
  }

  input.addEventListener("change", async () => {

    const file = input.files[0];

    if (!file) return;

    result.style.display = "none";

    status.className = "";
    status.textContent = "Converting... ⏳";

    try {

      const heic = await isHeic(file);

      if (!heic) {
        throw new Error(
          "This file does not appear to be a HEIC image."
        );
      }

      const quality =
        Number(qualitySelect.value);

      const jpeg = await heicTo({

        blob: file,

        type: "image/jpeg",

        quality: quality

      });

      const url =
        URL.createObjectURL(jpeg);

      preview.src = url;

      download.href = url;

      fileInfo.textContent =
        "Original: " +
        formatBytes(file.size) +
        " • JPG: " +
        formatBytes(jpeg.size);

      status.textContent =
        "Conversion complete!";

      status.className =
        "success";

      result.style.display =
        "block";

    } catch (error) {

      console.error(error);

      status.textContent =
        "Sorry, we couldn't convert this file.";

      status.className =
        "error";

    }

  });

</script>

</body>
</html>
