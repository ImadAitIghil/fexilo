<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fexilo — Private HEIC to JPG Converter</title>
  
  <!-- المكتبات الضرورية -->
  <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

  <style>
    :root { --bg: #0a0c16; --bg-soft: #0f1220; --surface: #141830; --text: #e9ebf5; --blue: #5b7fff; --violet: #9b6bff; --line: #262c4d; }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; padding: 20px; }
    .wrap { max-width: 880px; margin: 0 auto; text-align: center; }
    .dropzone { border: 1.5px dashed var(--line); border-radius: 16px; padding: 40px; background: var(--bg-soft); cursor: pointer; margin-bottom: 30px; }
    .btn { padding: 12px 24px; background: linear-gradient(100deg, var(--blue), var(--violet)); color: white; border: none; border-radius: 11px; cursor: pointer; font-weight: 600; margin: 5px; }
    .preview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-top: 30px; }
    .preview-card { background: var(--surface); padding: 15px; border-radius: 12px; border: 1px solid var(--line); }
    .preview-card img { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; }
    .loading-text { color: var(--blue); font-size: 14px; animation: blink 1.5s infinite; }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
  </style>
</head>
<body>

<div class="wrap">
  <h1>Convert HEIC to JPG</h1>
  
  <div class="dropzone" id="dropzone">
    <h2>Select your HEIC photos</h2>
    <p>Drag & drop or click to upload</p>
    <input type="file" id="fileInput" multiple accept=".heic,.HEIC" style="display:none">
  </div>

  <div id="batchActions" style="display:none; margin-bottom: 20px;">
    <button class="btn" onclick="downloadAll()">Download All (JPG)</button>
    <button class="btn" style="background: var(--violet)" onclick="downloadZip()">Download as ZIP</button>
  </div>

  <div class="preview-grid" id="previewGrid"></div>
</div>

<script>
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  const previewGrid = document.getElementById('previewGrid');
  const batchActions = document.getElementById('batchActions');
  let processedFiles = [];

  dropzone.onclick = () => fileInput.click();
  fileInput.onchange = (e) => handleFiles(e.target.files);

  async function handleFiles(files) {
    batchActions.style.display = 'block';
    for (let file of files) {
      const card = document.createElement('div');
      card.className = 'preview-card';
      card.innerHTML = `<p class="loading-text">Converting...</p><p>${file.name}</p>`;
      previewGrid.appendChild(card);

      try {
        const convertedBlob = await heic2any({ blob: file, toType: "image/jpeg", quality: 0.8 });
        const url = URL.createObjectURL(convertedBlob);
        const fileName = file.name.replace(/\.[^/.]+$/, ".jpg");
        
        processedFiles.push({ name: fileName, blob: convertedBlob });
        
        card.innerHTML = `<img src="${url}"><p style="font-size:12px">${fileName}</p>
                          <button class="btn" style="padding:5px 10px; font-size:12px" onclick="saveAs('${url}', '${fileName}')">Download</button>`;
      } catch (err) {
        card.innerHTML = `<p style="color:#ff6b7a">Error converting</p>`;
      }
    }
  }

  function downloadAll() {
    processedFiles.forEach(f => saveAs(f.blob, f.name));
  }

  async function downloadZip() {
    const zip = new JSZip();
    processedFiles.forEach(f => zip.file(f.name, f.blob));
    const content = await zip.generateAsync({type:"blob"});
    saveAs(content, "converted_images.zip");
  }
</script>

</body>
</html>
