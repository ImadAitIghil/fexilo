<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Fexilo — Private HEIC to JPG Converter</title>
  
  <!-- المكتبات البرمجية المضافة للوظائف الجديدة -->
  <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

  <!-- الكود الأصلي ديالك (CSS + Links) -->
  <style>
    :root { --bg: #0a0c16; --bg-soft: #0f1220; --surface: #141830; --surface-2: #1a1f3d; --line: #262c4d; --text: #e9ebf5; --muted: #8b90ac; --muted-dim: #5c6086; --blue: #5b7fff; --violet: #9b6bff; --blue-soft: rgba(91,127,255,.14); --violet-soft: rgba(155,107,255,.14); --success: #4fd1a5; --danger: #ff6b7a; --radius: 16px; --font-display: "Space Grotesk", sans-serif; --font-body: "Inter", sans-serif; --font-mono: "JetBrains Mono", monospace; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font-family: var(--font-body); }
    .wrap { max-width: 880px; margin: 0 auto; padding: 0 24px; }
    .hero { padding: 56px 0 8px; text-align: center; }
    .dropzone { border: 1.5px dashed var(--line); border-radius: 10px; padding: 46px 24px; text-align: center; background: var(--bg-soft); cursor: pointer; }
    .visually-hidden { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); }
    /* ستايل إضافي للنتائج والبريفيو باش يبقى فالتصميم ديالك */
    .preview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-top: 30px; }
    .card { background: var(--surface); padding: 10px; border-radius: 12px; border: 1px solid var(--line); text-align: center; }
    .card img { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; }
    .actions-panel { margin-top: 20px; display: flex; justify-content: center; gap: 10px; }
    .btn { padding: 10px 20px; background: var(--blue); color: white; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; }
  </style>
</head>

<body>
  <div class="wrap">
    <section class="hero">
      <h1>Convert HEIC to JPG.<br><span style="color:var(--blue)">Fast. Private. Simple.</span></h1>
    </section>

    <section class="panel">
      <div class="dropzone" id="dropzone">
        <h2>Select your HEIC photos</h2>
        <p>Click or drag to convert</p>
        <input type="file" id="fileInput" multiple accept=".heic,.HEIC" class="visually-hidden">
      </div>
      
      <div id="actions" class="actions-panel" style="display:none;">
        <button class="btn" onclick="downloadAll()">Download All</button>
        <button class="btn" onclick="downloadZip()">Download ZIP</button>
      </div>
      
      <div id="previewGrid" class="preview-grid"></div>
    </section>
  </div>

  <script>
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const previewGrid = document.getElementById('previewGrid');
    const actions = document.getElementById('actions');
    let processedFiles = [];

    dropzone.onclick = () => fileInput.click();
    fileInput.onchange = (e) => handleFiles(e.target.files);

    async function handleFiles(files) {
      actions.style.display = 'flex';
      for (let file of files) {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `<p style="font-size:12px; color:var(--blue)">Converting...</p><p style="font-size:12px">${file.name}</p>`;
        previewGrid.appendChild(card);

        try {
          const blob = await heic2any({ blob: file, toType: "image/jpeg", quality: 0.8 });
          const url = URL.createObjectURL(blob);
          const name = file.name.replace(/\.[^/.]+$/, ".jpg");
          processedFiles.push({ name, blob });
          card.innerHTML = `<img src="${url}"><p style="font-size:12px">${name}</p>
                            <button class="btn" style="padding:5px 10px; font-size:11px" onclick="saveAs('${url}','${name}')">Download</button>`;
        } catch { card.innerHTML = `<p style="color:var(--danger)">Error</p>`; }
      }
    }

    function downloadAll() { processedFiles.forEach(f => saveAs(f.blob, f.name)); }
    async function downloadZip() {
      const zip = new JSZip();
      processedFiles.forEach(f => zip.file(f.name, f.blob));
      const content = await zip.generateAsync({type:"blob"});
      saveAs(content, "Fexilo_Images.zip");
    }
  </script>
</body>
</html>
