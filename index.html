<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fexilo - HEIC to JPG Converter</title>
  <meta name="description" content="Convert HEIC images to JPG online for free. Fast, private and easy to use.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 40px 20px;
      text-align: center;
    }

    .logo {
      font-size: 32px;
      font-weight: 800;
      color: #4f46e5;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 38px;
      margin: 10px 0;
    }

    .subtitle {
      color: #6b7280;
      font-size: 17px;
      margin-bottom: 35px;
    }

    .upload-box {
      background: white;
      border: 2px dashed #c7d2fe;
      border-radius: 20px;
      padding: 50px 20px;
      cursor: pointer;
      transition: 0.2s;
    }

    .upload-box:hover {
      border-color: #4f46e5;
      background: #fafaff;
    }

    .upload-icon {
      font-size: 55px;
      margin-bottom: 15px;
    }

    .upload-text {
      font-size: 20px;
      font-weight: 700;
    }

    .upload-hint {
      color: #6b7280;
      margin-top: 8px;
    }

    input[type="file"] {
      display: none;
    }

    .privacy {
      margin-top: 25px;
      color: #6b7280;
      font-size: 14px;
    }

    .footer {
      margin-top: 60px;
      color: #9ca3af;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 30px;
      }

      .container {
        padding-top: 30px;
      }

      .upload-box {
        padding: 40px 15px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">Fexilo</div>

    <h1>Convert HEIC to JPG</h1>

    <p class="subtitle">
      Free, fast and private HEIC to JPG converter.
    </p>

    <label class="upload-box" for="fileInput">

      <div class="upload-icon">📷</div>

      <div class="upload-text">
        Choose HEIC files
      </div>

      <div class="upload-hint">
        Tap here to select your images
      </div>

    </label>

    <input
      id="fileInput"
      type="file"
      accept=".heic,.heif,image/heic,image/heif"
      multiple
    >

    <div class="privacy">
      🔒 Your files are processed privately in your browser.
    </div>

    <div class="footer">
      © 2026 Fexilo
    </div>

  </div>

</body>
</html>
