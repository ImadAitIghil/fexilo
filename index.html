  <!-- HEIC conversion -->
  <script src="https://cdn.jsdelivr.net/npm/heic-to@1.1.1/dist/iife/heic-to.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --secondary: #f3f4f6;
      --secondary-hover: #e5e7eb;
      --text: #111827;

      --border: #e5e7eb;
      --bg: #f9fafb;
      --card: #ffffff;
      --success: #059669;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:

        BlinkMacSystemFont,
        "Segoe UI",

    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);

      text-align: center;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 700;

    }

    header p {

    }

        border-color 0.2s,
        background 0.2s;
    }

    .drop-zone.dragover {

      background: #e0e7ff;
    }

    .drop-zone h2 {
      font-size: 1.125rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .drop-zone p {
      font-size: 0.875rem;
      color: var(--muted);
    }

    .drop-zone .btn {
      margin-top: 1rem;
    }

    input[type="file"] {
      display: none;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;

      padding: 0.75rem 1.25rem;

      font-size: 0.9375rem;
      font-weight: 600;

      border-radius: 8px;
      border: none;

      cursor: pointer;

      transition:
        background 0.15s,

    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: var(--secondary);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: var(--secondary-hover);
    }

    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }

    .results {
      margin-top: 1.5rem;
      display: none;
    }

    .results.visible {
      display: block;
    }

    .results-header {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      margin-bottom: 1.25rem;
    }

    .results-header h2 {
      font-size: 1.125rem;
      font-weight: 600;
      flex: 1 1 auto;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;

    }

    .file-list {

    }

    .file-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);

      padding: 0.875rem;

      display: flex;

      align-items: center;
    }

    .file-card img {
      width: 64px;
      height: 64px;

      object-fit: cover;

      border-radius: 8px;
      background: #f3f4f6;

      flex-shrink: 0;
    }

    .file-info {
      flex: 1;
      min-width: 0;
    }

    .file-info .name {
      font-weight: 600;
      font-size: 0.875rem;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-info .sizes {

      color: var(--muted);
      margin-top: 0.15rem;
    }

    .file-info .status {
      font-size: 0.75rem;
      margin-top: 0.15rem;
    }

    .status.success {
      color: var(--success);
    }

    .status.error {
      color: #dc2626;
    }

    .file-actions {
      flex-shrink: 0;
    }

    .privacy {
      margin-top: 2rem;

      text-align: center;

      font-size: 0.8125rem;
      color: var(--muted);

      line-height: 1.4;
    }

    .privacy strong {
      color: var(--text);
    }

    footer {
      text-align: center;

      padding: 1rem;

      font-size: 0.75rem;
      color: var(--muted);

      border-top: 1px solid var(--border);
      background: var(--card);
    }

    .spinner {
      width: 18px;
      height: 18px;

      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;

      border-radius: 50%;

      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .download-note {
      width: 100%;
      margin-top: 0.25rem;

      font-size: 0.75rem;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 480px) {
      .file-card {
        flex-direction: column;
        align-items: flex-start;
      }

      .file-actions {
        width: 100%;
      }

      .file-actions .btn {
        width: 100%;
      }

      .actions {
        width: 100%;
      }

      .actions .btn {
        flex: 1 1 auto;
      }

      .download-note {
        margin-top: 0.5rem;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>Fexilo</h1>
    <p>Free private HEIC → JPG converter</p>
  </header>

  <main>

    <div class="drop-zone" id="dropZone">

      <h2>Drop HEIC / HEIF files here</h2>

      <p>
        or click to select • Multiple files supported
      </p>

      <button
        type="button"
        class="btn btn-primary"
        id="selectBtn"
      >
        Select Files
      </button>

      <input
        type="file"
        id="fileInput"
        accept=".heic,.heif,image/heic,image/heif"
        multiple
      />

    </div>


    <div class="results" id="results">

      <div class="results-header">

        <h2 id="resultsTitle">
          Converted
        </h2>

        <div
          class="actions"
          id="actions"
        ></div>

      </div>


      <div
        class="file-list"
        id="fileList"
      ></div>


      <div
        style="margin-top:1.25rem;text-align:center;"
      >

        <button
          type="button"
          class="btn btn-secondary"
          id="startOverBtn"
        >
          Start Over
        </button>

      </div>

    </div>


    <p class="privacy">

      <strong>100% private.</strong>

      All conversion happens in your browser.
      <br />

      Your photos never leave your device.
      No uploads. No accounts.

    </p>

  </main>


  <footer>
    Fexilo • Free HEIC to JPG converter
  </footer>


  <script>

    const QUALITY = 0.95;
    const DOWNLOAD_DELAY_MS = 700;


    const dropZone =
      document.getElementById("dropZone");

    const fileInput =
      document.getElementById("fileInput");

    const selectBtn =
      document.getElementById("selectBtn");

    const results =
      document.getElementById("results");

    const resultsTitle =
      document.getElementById("resultsTitle");

    const actions =
      document.getElementById("actions");

    const fileList =
      document.getElementById("fileList");

    const startOverBtn =
      document.getElementById("startOverBtn");


    let convertedFiles = [];


    // -----------------------------
    // Helpers
    // -----------------------------

    function formatBytes(bytes) {

      if (bytes < 1024) {
        return bytes + " B";
      }

      if (bytes < 1024 * 1024) {
        return (
          (bytes / 1024).toFixed(1)
          + " KB"
        );
      }

      return (
        (bytes / (1024 * 1024)).toFixed(2)
        + " MB"
      );
    }


    function sanitizeFilename(name) {

      let base =
        name.split(/[/\\]/).pop()
        || "image";


      base =
        base
          .replace(
            /[<>:"/\\|?*\x00-\x1F]/g,
            "_"
          )
          .trim();


      if (!base) {
        base = "image";
      }


      base =
        base.replace(
          /\.(heic|heif)$/i,
          ".jpg"
        );


      if (!/\.jpg$/i.test(base)) {
        base += ".jpg";
      }


      return base;
    }


    function revokeAllUrls() {

      convertedFiles.forEach(file => {

        if (file.url) {
          URL.revokeObjectURL(file.url);
        }

      });

    }


    // -----------------------------
    // UI
    // -----------------------------

    function showResults() {

      dropZone.style.display = "none";

      results.classList.add("visible");

    }


    function resetUI() {

      revokeAllUrls();

      convertedFiles = [];

      fileList.innerHTML = "";

      actions.innerHTML = "";

      results.classList.remove("visible");

      dropZone.style.display = "block";

      fileInput.value = "";

      restoreDropZone();

    }


    function restoreDropZone() {

      dropZone.innerHTML = `

        <h2>
          Drop HEIC / HEIF files here
        </h2>

        <p>
          or click to select • Multiple files supported
        </p>

        <button
          type="button"
          class="btn btn-primary"
          id="selectBtn"
        >
          Select Files
        </button>

      `;


      const newSelectBtn =
        document.getElementById("selectBtn");


      newSelectBtn.addEventListener(
        "click",
        () => fileInput.click()
      );

    }


    function renderActions() {

      actions.innerHTML = "";


      const successFiles =
        convertedFiles.filter(
          file =>
            !file.error &&
            file.blob
        );


      const successCount =
        successFiles.length;


      if (successCount === 0) {
        return;
      }


      // -----------------------------
      // ONE FILE
      // -----------------------------

      if (successCount === 1) {

        const btn =
          document.createElement("button");


        btn.type = "button";

        btn.className =
          "btn btn-primary";

        btn.textContent =
          "Download JPG";


        const index =
          convertedFiles.indexOf(
            successFiles[0]
          );


        btn.addEventListener(
          "click",
          () => downloadSingle(index)
        );


        actions.appendChild(btn);

        return;
      }


      // -----------------------------
      // MULTIPLE FILES
      // -----------------------------

      const allBtn =
        document.createElement("button");


      allBtn.type = "button";

      allBtn.className =
        "btn btn-primary";

      allBtn.textContent =
        `Download All JPGs (${successCount})`;


      allBtn.addEventListener(
        "click",
        downloadAllIndividually
      );


      actions.appendChild(allBtn);


      const zipBtn =
        document.createElement("button");


      zipBtn.type = "button";

      zipBtn.className =
        "btn btn-secondary";

      zipBtn.textContent =
        "Download as ZIP";


      zipBtn.addEventListener(
        "click",
        downloadAsZip
      );


      actions.appendChild(zipBtn);


      const note =
        document.createElement("div");


      note.className =
        "download-note";


      note.textContent =
        "On some phones, your browser may ask for permission for multiple downloads. ZIP is the alternative.";


      actions.appendChild(note);

    }


    function renderFileList() {

      fileList.innerHTML = "";


      convertedFiles.forEach(
        (file, index) => {

          const card =
            document.createElement("div");


          card.className =
            "file-card";


          const img =
            document.createElement("img");


          img.alt =
            file.jpgName;


          if (file.url) {

            img.src =
              file.url;

          } else {

            img.src =
              "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64'><rect fill='%23f3f4f6' width='64' height='64'/></svg>";

          }


          const info =
            document.createElement("div");


          info.className =
            "file-info";


          const nameEl =
            document.createElement("div");


          nameEl.className =
            "name";


          nameEl.textContent =
            file.jpgName;


          nameEl.title =
            file.jpgName;


          const sizesEl =
            document.createElement("div");


          sizesEl.className =
            "sizes";


          if (!file.error) {

            sizesEl.textContent =
              `${formatBytes(file.originalSize)} → ${formatBytes(file.convertedSize)}`;

          }


          const statusEl =
            document.createElement("div");


          statusEl.className =
            "status " +
            (
              file.error
                ? "error"
                : "success"
            );


          statusEl.textContent =
            file.error
              ? file.error
              : "Converted";


          info.appendChild(nameEl);

          info.appendChild(sizesEl);

          info.appendChild(statusEl);


          const actionsDiv =
            document.createElement("div");


          actionsDiv.className =
            "file-actions";


          if (!file.error && file.blob) {

            const dlBtn =
              document.createElement("button");


            dlBtn.type = "button";

            dlBtn.className =
              "btn btn-primary";


            dlBtn.style.padding =
              "0.5rem 0.9rem";


            dlBtn.style.fontSize =
              "0.8125rem";


            dlBtn.textContent =
              "Download JPG";


            dlBtn.addEventListener(
              "click",
              () => downloadSingle(index)
            );


            actionsDiv.appendChild(dlBtn);

          }


          card.appendChild(img);

          card.appendChild(info);

          card.appendChild(actionsDiv);


          fileList.appendChild(card);

        }
      );


      const successCount =
        convertedFiles.filter(
          file =>
            !file.error &&
            file.blob
        ).length;


      resultsTitle.textContent =
        successCount === 1
          ? "1 file converted"
          : `${successCount} files converted`;

    }


    // -----------------------------
    // Conversion
    // -----------------------------

    async function convertFile(file) {

      const originalName =
        file.name;


      const jpgName =
        sanitizeFilename(
          originalName
        );


      const originalSize =
        file.size;


      try {

        if (typeof HeicTo !== "function") {
          throw new Error(
            "HEIC converter library not loaded."
          );
        }


        const blob =
          await HeicTo({

            blob: file,

            type: "image/jpeg",

            quality: QUALITY

          });


        if (!blob) {
          throw new Error(
            "No converted image returned."
          );
        }


        const url =
          URL.createObjectURL(blob);


        return {

          originalName,

          jpgName,

          blob,

          url,

          originalSize,

          convertedSize:
            blob.size

        };

      } catch (err) {

        console.error(
          "Conversion failed:",
          originalName,
          err
        );


        return {

          originalName,

          jpgName,

          blob: null,

          url: null,

          originalSize,

          convertedSize: 0,

          error:
            "Conversion failed"

        };

      }

    }


    async function processFiles(fileListInput) {

      const files =
        Array.from(fileListInput)
          .filter(file => {

            const name =
              file.name.toLowerCase();


            return (
              name.endsWith(".heic") ||
              name.endsWith(".heif") ||
              file.type === "image/heic" ||
              file.type === "image/heif"
            );

          });


      if (files.length === 0) {

        alert(
          "Please select HEIC or HEIF files."
        );

        return;

      }


      dropZone.innerHTML = `

        <h2>
          Converting…
        </h2>

        <p>
          Please wait
        </p>

        <div
          style="
            margin-top:1rem;
            display:flex;
            justify-content:center
          "
        >

          <div
            class="spinner"
            style="
              border-color:rgba(79,70,229,0.3);
              border-top-color:var(--primary)
            "
          ></div>

        </div>

      `;


      convertedFiles = [];


      for (const file of files) {

        const result =
          await convertFile(file);


        convertedFiles.push(result);

      }


      restoreDropZone();


      showResults();

      renderFileList();

      renderActions();

    }


    // -----------------------------
    // Downloads
    // -----------------------------

    function triggerDownload(
      blob,
      filename
    ) {

      if (!blob) {
        return;
      }


      const url =
        URL.createObjectURL(blob);


      const a =
        document.createElement("a");


      a.href = url;

      a.download = filename;

      a.style.display = "none";


      document.body.appendChild(a);


      // Trigger download
      a.click();


      setTimeout(
        () => {

          if (a.parentNode) {
            a.parentNode.removeChild(a);
          }

          URL.revokeObjectURL(url);

        },
        1500
      );

    }


    function downloadSingle(index) {

      const file =
        convertedFiles[index];


      if (
        !file ||
        file.error ||
        !file.blob
      ) {

        return;

      }


      triggerDownload(
        file.blob,
        file.jpgName
      );

    }


    async function downloadAllIndividually() {

      const success =
        convertedFiles.filter(
          file =>
            !file.error &&
            file.blob
        );


      if (success.length === 0) {
        return;
      }


      for (
        let i = 0;
        i < success.length;
        i++
      ) {

        triggerDownload(
          success[i].blob,
          success[i].jpgName
        );


        if (
          i <
          success.length - 1
        ) {

          await new Promise(
            resolve =>
              setTimeout(
                resolve,
                DOWNLOAD_DELAY_MS
              )
          );
