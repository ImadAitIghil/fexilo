<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>HEIC → JPG — Convert Images at the Speed of Light</title>

  <meta
    name="description"
    content="Convert HEIC and HEIF photos to high-quality JPG instantly. Private, fast and browser-based. Your photos never leave your device."
  />

  <meta name="theme-color" content="#050507" />

  <meta
    property="og:title"
    content="HEIC → JPG — Convert Images at the Speed of Light"
  />
  <meta
    property="og:description"
    content="A private, futuristic HEIC to JPG converter that runs directly in your browser."
  />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  />

  <!-- HEIC decoder -->
  <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>

  <style>
    /* =========================================================
       RESET
    ========================================================= */

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: #f8f7ff;
      background:
        radial-gradient(circle at 15% 10%, rgba(111, 74, 255, .16), transparent 28%),
        radial-gradient(circle at 85% 15%, rgba(0, 229, 255, .12), transparent 25%),
        radial-gradient(circle at 50% 100%, rgba(255, 53, 176, .09), transparent 30%),
        #050507;
      font-family: "Inter", sans-serif;
      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    ::selection {
      background: #8b5cf6;
      color: white;
    }

    /* =========================================================
       BACKGROUND UNIVERSE
    ========================================================= */

    .universe {
      position: fixed;
      inset: 0;
      z-index: -10;
      overflow: hidden;
      pointer-events: none;
    }

    .stars {
      position: absolute;
      inset: 0;
      opacity: .42;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.7) 1px, transparent 1px),
        radial-gradient(circle, rgba(255,255,255,.35) 1px, transparent 1px);
      background-size: 97px 97px, 173px 173px;
      background-position: 0 0, 31px 64px;
      animation: starDrift 28s linear infinite;
    }

    .grid {
      position: absolute;
      width: 160%;
      height: 55%;
      left: -30%;
      bottom: -19%;
      opacity: .18;
      transform: perspective(450px) rotateX(63deg);
      transform-origin: center top;
      background-image:
        linear-gradient(rgba(124, 92, 255, .35) 1px, transparent 1px),
        linear-gradient(90deg, rgba(124, 92, 255, .35) 1px, transparent 1px);
      background-size: 55px 55px;
      mask-image: linear-gradient(to bottom, transparent, black 20%, black);
      animation: gridMove 9s linear infinite;
    }

    .aurora {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: .32;
      animation: float 12s ease-in-out infinite;
    }

    .aurora.one {
      width: 450px;
      height: 450px;
      background: #6638ff;
      top: -170px;
      left: -120px;
    }

    .aurora.two {
      width: 360px;
      height: 360px;
      background: #00c8ff;
      right: -100px;
      top: 170px;
      animation-delay: -4s;
    }

    .aurora.three {
      width: 330px;
      height: 330px;
      background: #ff2b9b;
      left: 38%;
      bottom: -230px;
      animation-delay: -7s;
    }

    @keyframes starDrift {
      from { transform: translateY(0); }
      to { transform: translateY(97px); }
    }

    @keyframes gridMove {
      from { background-position: 0 0, 0 0; }
      to { background-position: 0 55px, 55px 0; }
    }

    @keyframes float {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(30px, -35px, 0) scale(1.08); }
    }

    /* =========================================================
       HEADER
    ========================================================= */

    header {
      width: min(1180px, calc(100% - 36px));
      margin: 0 auto;
      padding: 25px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: white;
    }

    .brand-mark {
      position: relative;
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 13px;
      background:
        linear-gradient(135deg, #8b5cf6, #5b4cff 45%, #00d9ff);
      box-shadow:
        0 0 35px rgba(99, 76, 255, .35),
        inset 0 1px 0 rgba(255,255,255,.35);
    }

    .brand-mark::after {
      content: "";
      width: 14px;
      height: 14px;
      border: 2px solid white;
      border-radius: 4px;
      transform: rotate(45deg);
    }

    .brand-name {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -.02em;
    }

    .brand-name span {
      color: #8b7cff;
    }

    .header-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 13px;
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 100px;
      background: rgba(255,255,255,.035);
      backdrop-filter: blur(15px);
      color: #aaa6bb;
      font-family: "DM Mono", monospace;
      font-size: 10px;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #35e6a0;
      box-shadow: 0 0 12px #35e6a0;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      50% {
        opacity: .35;
        transform: scale(.75);
      }
    }

    /* =========================================================
       HERO
    ========================================================= */

    main {
      width: min(1180px, calc(100% - 36px));
      margin: 0 auto;
      padding-bottom: 90px;
    }

    .hero {
      text-align: center;
      padding: 78px 0 48px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 8px 13px;
      border: 1px solid rgba(139, 92, 246, .25);
      border-radius: 100px;
      background: rgba(139, 92, 246, .07);
      color: #b7a8ff;
      font-family: "DM Mono", monospace;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: .11em;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    .eyebrow-icon {
      color: #00dcff;
    }

    h1 {
      max-width: 950px;
      margin: 0 auto;
      font-size: clamp(48px, 8vw, 94px);
      line-height: .92;
      letter-spacing: -.075em;
      font-weight: 900;
    }

    h1 .gradient {
      background:
        linear-gradient(
          105deg,
          #fff 5%,
          #a99aff 35%,
          #73eaff 62%,
          #fff 85%
        );
      background-size: 250% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: textShimmer 6s linear infinite;
    }

    @keyframes textShimmer {
      to {
        background-position: 250% center;
      }
    }

    .hero-subtitle {
      max-width: 610px;
      margin: 28px auto 0;
      color: #918d9f;
      font-size: 16px;
      line-height: 1.7;
    }

    .hero-subtitle strong {
      color: #ddd9e8;
      font-weight: 600;
    }

    /* =========================================================
       CONVERTER
    ========================================================= */

    .converter-shell {
      position: relative;
      max-width: 920px;
      margin: 20px auto 0;
      padding: 1px;
      border-radius: 30px;
      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,.18),
          rgba(139,92,246,.28),
          rgba(0,220,255,.12),
          rgba(255,255,255,.04)
        );
      box-shadow:
        0 45px 120px rgba(0,0,0,.5),
        0 0 80px rgba(101,74,255,.08);
    }

    .converter {
      position: relative;
      overflow: hidden;
      border-radius: 29px;
      padding: 18px;
      background:
        linear-gradient(145deg, rgba(16,15,22,.95), rgba(8,8,12,.97));
      backdrop-filter: blur(30px);
    }

    .converter::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% -20%, rgba(117, 85, 255, .12), transparent 40%);
    }

    /* =========================================================
       DROPZONE
    ========================================================= */

    .dropzone {
      position: relative;
      min-height: 390px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      border: 1px dashed rgba(160,145,255,.25);
      border-radius: 22px;
      background:
        radial-gradient(
          circle at center,
          rgba(104,80,255,.085),
          rgba(255,255,255,.015) 55%,
          transparent 75%
        );
      transition:
        border-color .3s ease,
        background .3s ease,
        transform .3s ease;
      overflow: hidden;
    }

    .dropzone::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 35px 35px;
      mask-image: radial-gradient(circle, black, transparent 75%);
      pointer-events: none;
    }

    .dropzone.dragging {
      transform: scale(.995);
      border-color: #8b75ff;
      background:
        radial-gradient(
          circle at center,
          rgba(104,80,255,.18),
          rgba(0,220,255,.04) 65%,
          transparent 80%
        );
      box-shadow: inset 0 0 60px rgba(111, 80, 255, .08);
    }

    .upload-orbit {
      position: relative;
      width: 104px;
      height: 104px;
      display: grid;
      place-items: center;
      margin-bottom: 25px;
    }

    .orbit-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid rgba(139, 92, 246, .22);
      animation: orbitSpin 8s linear infinite;
    }

    .orbit-ring::before,
    .orbit-ring::after {
      content: "";
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #9c85ff;
      box-shadow: 0 0 14px #8b5cf6;
    }

    .orbit-ring::before {
      top: -3px;
      left: 50%;
    }

    .orbit-ring::after {
      bottom: 10px;
      right: -3px;
      background: #00dcff;
      box-shadow: 0 0 14px #00dcff;
    }

    @keyframes orbitSpin {
      to { transform: rotate(360deg); }
    }

    .upload-icon {
      position: relative;
      width: 67px;
      height: 67px;
      display: grid;
      place-items: center;
      border-radius: 22px;
      background:
        linear-gradient(145deg, #7b5cff, #3f37bd);
      box-shadow:
        0 18px 50px rgba(102, 74, 255, .35),
        inset 0 1px 0 rgba(255,255,255,.3);
      font-size: 26px;
    }

    .upload-icon svg {
      width: 29px;
      height: 29px;
      fill: none;
      stroke: white;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .drop-title {
      position: relative;
      z-index: 1;
      margin: 0;
      font-size: 23px;
      font-weight: 800;
      letter-spacing: -.04em;
    }

    .drop-description {
      position: relative;
      z-index: 1;
      margin: 10px 0 24px;
      color: #777382;
      font-size: 13px;
    }

    .drop-description span {
      color: #b3adbd;
    }

    .primary-button {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-width: 174px;
      height: 49px;
      padding: 0 21px;
      border: 0;
      border-radius: 13px;
      color: white;
      background:
        linear-gradient(135deg, #8064ff, #5748e9);
      box-shadow:
        0 13px 30px rgba(91, 71, 230, .3),
        inset 0 1px 0 rgba(255,255,255,.25);
      font-size: 13px;
      font-weight: 700;
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .primary-button:hover {
      transform: translateY(-2px);
      box-shadow:
        0 18px 38px rgba(91, 71, 230, .4),
        inset 0 1px 0 rgba(255,255,255,.3);
    }

    .primary-button:active {
      transform: translateY(0);
    }

    .file-limit {
      position: relative;
      z-index: 1;
      margin-top: 15px;
      color: #55515f;
      font-family: "DM Mono", monospace;
      font-size: 9px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    #fileInput {
      display: none;
    }

    /* =========================================================
       OPTIONS
    ========================================================= */

    .options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding: 16px 5px 2px;
    }

    .privacy {
      display: flex;
      align-items: center;
      gap: 9px;
      color: #696573;
      font-size: 10px;
    }

    .privacy svg {
      width: 15px;
      height: 15px;
      stroke: #35e6a0;
      fill: none;
      stroke-width: 1.8;
    }

    .quality-control {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #777381;
      font-family: "DM Mono", monospace;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    .quality-control input {
      width: 100px;
      accent-color: #8064ff;
    }

    .quality-value {
      width: 34px;
      color: #b8b2c4;
      font-weight: 500;
    }

    /* =========================================================
       FILE RESULTS
    ========================================================= */

    .results {
      display: none;
      margin-top: 12px;
    }

    .results.active {
      display: block;
      animation: resultIn .45s ease both;
    }

    @keyframes resultIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .results-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 5px 14px;
    }

    .results-count {
      color: #aaa4b4;
      font-size: 12px;
      font-weight: 600;
    }

    .results-count strong {
      color: white;
    }

    .download-all {
      height: 38px;
      padding: 0 14px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 10px;
      background: rgba(255,255,255,.04);
      color: #d4d0dc;
      font-size: 11px;
      font-weight: 600;
      transition: background .2s ease, border-color .2s ease;
    }

    .download-all:hover {
      border-color: rgba(139,92,246,.35);
      background: rgba(139,92,246,.09);
    }

    .download-all svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    .file-list {
      display: grid;
      gap: 8px;
    }

    .file-card {
      display: grid;
      grid-template-columns: 54px 1fr auto;
      align-items: center;
      gap: 13px;
      padding: 10px;
      min-height: 76px;
      border: 1px solid rgba(255,255,255,.055);
      border-radius: 15px;
      background: rgba(255,255,255,.025);
    }

    .file-thumb {
      width: 54px;
      height: 54px;
      overflow: hidden;
      border-radius: 10px;
      background: #101016;
      display: grid;
      place-items: center;
    }

    .file-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .file-placeholder {
      color: #655d79;
      font-family: "DM Mono", monospace;
      font-size: 8px;
    }

    .file-info {
      min-width: 0;
    }

    .file-name {
      color: #e2dee9;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
      font-weight: 600;
    }

    .file-meta {
      margin-top: 6px;
      display: flex;
      align-items: center;
      gap: 7px;
      color: #625e6a;
      font-family: "DM Mono", monospace;
      font-size: 8px;
    }

    .file-status {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #88828f;
      font-size: 10px;
      white-space: nowrap;
    }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,.1);
      border-top-color: #8b6dff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .success-icon {
      width: 20px;
      height: 20px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #07110d;
      background: #35e6a0;
      font-size: 11px;
      font-weight: 900;
      box-shadow: 0 0 16px rgba(53,230,160,.2);
    }

    .error-icon {
      width: 20px;
      height: 20px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: white;
      background: #ef527a;
      font-size: 12px;
    }

    .download-single {
      width: 35px;
      height: 35px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 9px;
      color: #aaa4b1;
      background: rgba(255,255,255,.035);
      transition: .2s;
    }

    .download-single:hover {
      color: white;
      border-color: rgba(139,92,246,.35);
      background: rgba(139,92,246,.12);
    }

    .download-single svg {
      width: 15px;
      height: 15px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
    }

    /* =========================================================
       FEATURES
    ========================================================= */

    .feature-grid {
      max-width: 920px;
      margin: 65px auto 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .feature {
      position: relative;
      padding: 24px;
      min-height: 170px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.055);
      border-radius: 19px;
      background: rgba(255,255,255,.022);
      backdrop-filter: blur(15px);
    }

    .feature::after {
      content: "";
      position: absolute;
      width: 110px;
      height: 110px;
      top: -55px;
      right: -55px;
      border-radius: 50%;
      background: var(--feature-color);
      filter: blur(55px);
      opacity: .16;
    }

    .feature-icon {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      margin-bottom: 18px;
      border-radius: 10px;
      color: var(--feature-color);
      background: color-mix(in srgb, var(--feature-color) 9%, transparent);
    }

    .feature-icon svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .feature h3 {
      margin: 0 0 7px;
      color: #ddd9e5;
      font-size: 13px;
      letter-spacing: -.02em;
    }

    .feature p {
      margin: 0;
      color: #66616e;
      font-size: 11px;
      line-height: 1.65;
    }

    /* =========================================================
       BOTTOM MESSAGE
    ========================
