<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Fexilo — Private HEIC to JPG Converter</title>
  <meta name="description" content="Convert HEIC and HEIF photos to JPG entirely in your browser. Nothing is uploaded.">

  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' blob: data:; connect-src 'none'; worker-src 'self' blob:; base-uri 'none'; form-action 'none'; object-src 'none'">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" referrerpolicy="no-referrer">

  <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js" referrerpolicy="no-referrer"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js" referrerpolicy="no-referrer"></script>

  <style>
    :root { --bg: #0a0c16; --bg-soft: #0f1220; --surface: #141830; --surface-2: #1a1f3d; --line: #262c4d; --text: #e9ebf5; --muted: #8b90ac; --muted-dim: #5c6086; --blue: #5b7fff; --violet: #9b6bff; --blue-soft: rgba(91,127,255,.14); --violet-soft: rgba(155,107,255,.14); --success: #4fd1a5; --danger: #ff6b7a; --radius: 16px; --font-display: "Space Grotesk", sans-serif; --font-body: "Inter", sans-serif; --font-mono: "JetBrains Mono", monospace; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(1100px 600px at 12% -10%, rgba(91,127,255,.16), transparent 60%), radial-gradient(900px 500px at 88% 8%, rgba(155,107,255,.14), transparent 55%), var(--bg); color: var(--text); font-family: var(--font-body); line-height: 1.5; -webkit-font-smoothing: antialiased; }
    .wrap { max-width: 880px; margin: 0 auto; padding: 0 24px; }
    .hero { padding: 56px 0 8px; text-align: center; }
    .hero h1 { font-family: var(--font-display); font-size: clamp(32px, 5.4vw, 52px); line-height: 1.06; margin: 0 0 16px; font-weight: 700; }
    .hero h1 .grad { background: linear-gradient(100deg, var(--blue), var(--violet) 65%); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .panel { margin-top: 44px; background: linear-gradient(180deg, var(--surface), var(--bg-soft)); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px; }
    .dropzone { border: 1.5px dashed var(--line); border-radius: 10px; padding: 46px 24px; text-align: center; background: var(--bg-soft); cursor: pointer; }
    .dropzone:hover { border-color: rgba(91,127,255,.65); }
    .visually-hidden { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); }
  </style>
</head>

<body>

  <div class="wrap">
    <header>
      <div class="brand">
        <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12L10 18L20 6" stroke="white" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span class="brand-name">Fexilo</span>
      </div>
    </header>

    <section class="hero">
      <h1>Convert HEIC to JPG.<br><span class="grad">Fast. Private. Simple.</span></h1>
      <p>Your iPhone photos are converted to JPG right in this browser tab. Nothing is uploaded.</p>
    </section>

    <section class="panel">
      <!-- هاد هو الجزء الأساسي اللي كان ناقص فيه الربط -->
      <div class="dropzone" id="dropzone" role="button" tabindex="0">
        <h2>Select your HEIC or HEIF photos</h2>
        <p>Choose one or several files, or drag them in.</p>
        <input type="file" id="fileInput" multiple accept=".heic,.HEIC,.heif,.HEIF" class="visually-hidden">
      </div>
    </section>
  </div>

  <script>
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');

    // 1. الربط عند النقر
    dropzone.addEventListener('click', () => fileInput.click());

    // 2. تفعيل السحب والإفلات
    dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.style.borderColor = 'var(--blue)'; });
    dropzone.addEventListener('dragleave', () => { dropzone.style.borderColor = 'var(--line)'; });
    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropzone.style.borderColor = 'var(--line)';
      handleFiles(e.dataTransfer.files);
    });

    // 3. معالجة الملفات
    fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

    async function handleFiles(files) {
      if (files.length === 0) return;
      for (let file of files) {
        try {
          const result = await heic2any({
            blob: file,
            toType: "image/jpeg",
            quality: 0.8
          });
          const url = URL.createObjectURL(Array.isArray(result) ? result[0] : result);
          const a = document.createElement('a');
          a.href = url;
          a.download = file.name.replace(/\.[^/.]+$/, "") + ".jpg";
          a.click();
        } catch (err) {
          console.error(err);
          alert("Conversion failed for: " + file.name);
        }
      }
    }
  </script>
</body>
</html>
