d="uploadHelp">
  Choose one or several files, or drag them in.
</p>

<button
  class="btn btn-primary"
  id="browseBtn"
  type="button"
>
  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <path
      d="M12 16V4M12 4L7 9M12 4l5 5"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
    />
    <path
      d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
    />
  </svg>
  Select your HEIC photos
</button>

<input
  type="file"
  id="fileInput"
  multiple
  accept=".heic,.HEIC,.heif,.HEIF,image/heic,image/heif"
  class="visually-hidden"
/>

<div class="formats-row" aria-hidden="true">
  <span class="chip">HEIC</span>
  <span class="chip">HEIF</span>
  <span class="chip">JPG</span>
</div>

      </div>

      <!-- Progress -->
      <div class="progress-wrap" id="progressWrap">

        <div class="progress-top">
          <h3 id="progressTitle">Converting photos...</h3>
          <span id="progressCount">0 / 0</span>
        </div>

        <div class="track">
          <div class="fill" id="progressFill"></div>
        </div>

        <div
          class="progress-file"
          id="progressFile"
        ></div>

      </div>

    </section>

    <!-- Results -->
    <section
      class="results"
      id="results"
    >

      <div class="results-head">

        <div>
          <h3 id="resultsTitle">Converted photos</h3>
          <div class="sub" id="resultsSub"></div>
        </div>

        <div class="results-actions">

          <button
            class="btn btn-ghost btn-sm"
            id="downloadAllBtn"
            type="button"
          >
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M12 4v11M12 15l-4-4M12 15l4-4"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M5 20h14"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
            Download All
          </button>

          <button
            class="btn btn-primary btn-sm"
            id="downloadZipBtn"
            type="button"
          >
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M7 3h8l3 3v15H7V3z"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linejoin="round"
              />
              <path
                d="M15 3v4h4"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linejoin="round"
              />
              <path
                d="M12 8v8M10 14l2 2 2-2"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            Download as ZIP
          </button>

        </div>

      </div>

      <div
        class="grid"
        id="resultsGrid"
      ></div>

    </section>

    <footer>
      Fexilo — Your photos stay on your device.
    </footer>

  </div>

  <div
    id="toast"
    role="status"
    aria-live="polite"
  ></div>

  <script>
    const dropzone = document.getElementById("dropzone");
    const browseBtn = document.getElementById("browseBtn");
    const fileInput = document.getElementById("fileInput");

    const progressWrap = document.getElementById("progressWrap");
    const progressTitle = document.getElementById("progressTitle");
    const progressCount = document.getElementById("progressCount");
    const progressFill = document.getElementById("progressFill");
    const progressFile = document.getElementById("progressFile");

    const results = document.getElementById("results");
    const resultsGrid = document.getElementById("resultsGrid");
    const resultsSub = document.getElementById("resultsSub");

    const downloadAllBtn =
      document.getElementById("downloadAllBtn");

    const downloadZipBtn =
      document.getElementById("downloadZipBtn");

    const toast =
      document.getElementById("toast");

    let convertedFiles = [];
    let isConverting = false;


    /* -----------------------------
       Upload
    ----------------------------- */

    browseBtn.addEventListener("click", (event) => {
      event.stopPropagation();

      if (!isConverting) {
        fileInput.click();
      }
    });


    dropzone.addEventListener("click", () => {
      if (!isConverting) {
        fileInput.click();
      }
    });


    dropzone.addEventListener("keydown", (event) => {
      if (
        event.key === "Enter" ||
        event.key === " "
      ) {
        event.preventDefault();

        if (!isConverting) {
          fileInput.click();
        }
      }
    });


    fileInput.addEventListener("change", (event) => {
      handleFiles(event.target.files);

      // Allow selecting the same file again.
      fileInput.value = "";
    });


    /* -----------------------------
       Drag & Drop
    ----------------------------- */

    dropzone.addEventListener("dragover", (event) => {
      event.preventDefault();

      if (!isConverting) {
        dropzone.classList.add("drag");
      }
    });


    dropzone.addEventListener("dragleave", () => {
      dropzone.classList.remove("drag");
    });


    dropzone.addEventListener("drop", (event) => {
      event.preventDefault();

      dropzone.classList.remove("drag");

      if (isConverting) {
        return;
      }

      handleFiles(event.dataTransfer.files);
    });


    /* -----------------------------
       File validation
    ----------------------------- */

    function isHEIC(file) {
      const name = file.name.toLowerCase();

      return (
        name.endsWith(".heic") ||
        name.endsWith(".heif") ||
        file.type === "image/heic" ||
        file.type === "image/heif"
      );
    }


    /* -----------------------------
       Toast
    ----------------------------- */

    let toastTimer;

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");

      clearTimeout(toastTimer);

      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 3000);
    }


    /* -----------------------------
       Main conversion
    ----------------------------- */

    async function handleFiles(fileList) {
      if (!fileList || !fileList.length) {
        return;
      }

      const files = Array.from(fileList);

      const validFiles = files.filter(isHEIC);

      if (!validFiles.length) {
        showToast(
          "Please select HEIC or HEIF photos."
        );
        return;
      }

      if (validFiles.length !== files.length) {
        showToast(
          "Only HEIC and HEIF photos can be converted."
        );
      }


      // Remove old object URLs.
      convertedFiles.forEach((item) => {
        if (item.url) {
          URL.revokeObjectURL(item.url);
        }
      });

      convertedFiles = [];

      resultsGrid.innerHTML = "";

      results.classList.remove("active");

      progressWrap.classList.add("active");

      progressFill.style.width = "0%";

      progressTitle.textContent =
        "Converting photos...";

      progressCount.textContent =
        `0 / ${validFiles.length}`;

      progressFile.textContent = "";

      isConverting = true;

      dropzone.classList.add("busy");


      let completed = 0;


      for (const file of validFiles) {

        progressFile.textContent =
          file.name;

        try {

          const result = await heic2any({
            blob: file,
            toType: "image/jpeg",
            quality: 0.8
          });


          /*
            heic2any can return either:
            - Blob
            - Array of Blob
          */

          const blob = Array.isArray(result)
            ? result[0]
            : result;


          const url =
            URL.createObjectURL(blob);


          const jpgName =
            file.name.replace(
              /\.[^/.]+$/,
              ""
            ) + ".jpg";


          const converted = {
            originalName: file.name,
            name: jpgName,
            blob: blob,
            url: url,
            size: blob.size
          };


          convertedFiles.push(converted);


          createResultCard(converted);


        } catch (error) {

          console.error(
            "HEIC conversion failed:",
            file.name,
            error
          );


          createErrorCard(
            file.name,
            error
          );
        }


        completed++;


        const percentage =
          Math.round(
            (completed /
              validFiles.length) * 100
          );


        progressFill.style.width =
          `${percentage}%`;

        progressCount.textContent =
          `${completed} / ${validFiles.length}`;
      }


      isConverting = false;

      dropzone.classList.remove("busy");


      if (convertedFiles.length) {

        progressTitle.textContent =
          "Conversion complete";

        progressFile.textContent =
          `${convertedFiles.length} photo${convertedFiles.length === 1 ? "" : "s"} ready to download`;

        resultsSub.textContent =
          `${convertedFiles.length} photo${convertedFiles.length === 1 ? "" : "s"} converted successfully.`;

        results.classList.add("active");

      } else {

        progressTitle.textContent =
          "Conversion failed";

        progressFile.textContent =
          "No photos could be converted.";
      }
    }


    /* -----------------------------
       Create result card
    ----------------------------- */

    function createResultCard(file) {

      const card =
        document.createElement("article");

      card.className = "card";


      const thumb =
        document.createElement("div");

      thumb.className = "card-thumb";


      const img =
        document.createElement("img");

      img.src = file.url;

      img.alt = file.name;

      img.loading = "lazy";


      thumb.appendChild(img);


      const body =
        document.createElement("div");

      body.className = "card-body";


      const name =
        document.createElement("div");

      name.className = "card-name";

      name.title = file.name;

      name.textContent = file.name;


      const meta =
        document.createElement("div");

      meta.className = "card-meta";

      meta.innerHTML = `
        <span>HEIC</span>
        <span class="arrow">→</span>
        <span class="down">JPG</span>
      `;


      const button =
        document.createElement("button");

      button.type = "button";

      button.className =
        "btn btn-primary btn-sm";

      button.innerHTML = `
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M12 4v11M12 15l-4-4M12 15l4-4"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M5 20h14"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
        Download
      `;


      button.addEventListener(
        "click",
        () => downloadFile(file)
      );


      body.appendChild(name);
      body.appendChild(meta);
      body.appendChild(button);

      card.appendChild(thumb);
      card.appendChild(body);

      resultsGrid.appendChild(card);
    }


    /* -----------------------------
       Error card
    ----------------------------- */

    function createErrorCard(
      fileName,
      error
    ) {

      const card =
        document.createElement("article");

      card.className = "card";


      const thumb =
        document.createElement("div");

      thumb.className =
        "card-thumb error-thumb";


      thumb.innerHTML = `
        <div>
          <svg viewBox="0 0 24 24" fill="none">
            <path
              d="M12 3L2.8 20h18.4L12 3z"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linejoin="round"
            />
            <path
              d="M12 9v5"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
            <circle
              cx="12"
              cy="17"
              r="1"
              fill="currentColor"
            />
          </svg>
        </div>
      `;


      const body =
        document.createElement("div");

      body.className =
        "card-body";


      const name =
        document.createElement("div");

      name.className =
        "card-name";

      name.title =
        fileName;

      name.textContent =
        fileName;


      const errorText =
        document.createElement("div");

      errorText.className =
        "card-error-text";

      errorText.textContent =
        "This photo could not be converted.";


      body.appendChild(name);
      body.appendChild(errorText);

      card.appendChild(thumb);
      card.appendChild(body);

      resultsGrid.appendChild(card);
    }


    /* -----------------------------
       Download one file
    ----------------------------- */

    function downloadFile(file) {

      const link =
        document.createElement("a");

      link.href =
        file.url;

      link.download =
        file.name;

      document.body.appendChild(link);

      link.click();

      link.remove();
    }


    /* -----------------------------
       Download all
    ----------------------------- */

    downloadAllBtn.addEventListener(
      "click",
      async () => {

        if (!convertedFiles.length) {
          return;
        }

        downloadAllBtn.disabled = true;

        const originalText =
          downloadAllBtn.innerHTML;

        downloadAllBtn.textContent =
          "Downloading...";


        for (const file of convertedFiles) {

          downloadFile(file);

          /*
            Small delay prevents some browsers
            from blocking multiple downloads.
          */

          await new Promise(
            resolve =>
              setTimeout(resolve, 180)
          );
        }


        downloadAllBtn.disabled = false;

        downloadAllBtn.innerHTML =
          originalText;
      }
    );


    /* -----------------------------
       Download ZIP
    ----------------------------- */

    downloadZipBtn.addEventListener(
      "click",
      async () => {

        if (!convertedFiles.length) {
          return;
        }

        downloadZipBtn.disabled = true;

        const originalText =
          downloadZipBtn.innerHTML;

        downloadZipBtn.textContent =
          "Creating ZIP...";


        try {

          const zip =
            new JSZip();


          convertedFiles.forEach(
            (file) => {

              zip.file(
                file.name,
                file.blob
              );
            }
          );


          const zipBlob =
            await zip.generateAsync({
              type: "blob",
              compression: "DEFLATE",
              compressionOptions: {
                level: 6
              }
            });


          const zipUrl =
            URL.createObjectURL(
              zipBlob
            );


          const link =
            document.createElement("a");

          link.href =
            zipUrl;

          link.download =
            "Fexilo-converted-photos.zip";


          document.body.appendChild(link);

          link.click();

          link.remove();


          setTimeout(() => {
            URL.revokeObjectURL(zipUrl);
          }, 1000);


        } catch (error) {

          console.error(
            "ZIP creation failed:",
            error
          );

          showToast(
            "Could not create the ZIP file."
          );
        }


        downloadZipBtn.disabled = false;

        downloadZipBtn.innerHTML =
          originalText;
      }
    );


    /* -----------------------------
       Cleanup
    ----------------------------- */

    window.addEventListener(
      "beforeunload",
      () => {

        convertedFiles.forEach(
          (file) => {

            if (file.url) {
              URL.revokeObjectURL(
                file.url
              );
            }
          }
        );
      }
    );
  </script>

</body>
</html>
