<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HEICX — HEIC to JPG</title>

<meta
  name="description"
  content="Convert HEIC and HEIF images to high-quality JPG directly in your browser."
>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
  href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800;900&display=swap"
  rel="stylesheet"
>

<script
  src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"
  defer
></script>

<style>

/* =========================================================
   ZERO-BLUR DESIGN SYSTEM
========================================================= */

:root {
  --bg: #05060a;
  --panel: #0a0c11;
  --panel-2: #0e1017;

  --white: #ffffff;
  --text: #e9e7ef;

  --muted: #737682;
  --muted-2: #4c4f5b;

  --line: #1b1e28;
  --line-2: #292d3a;

  --purple: #8267ff;
  --purple-dark: #5943df;

  --cyan: #62e5ff;
  --green: #39dfa5;
  --red: #ff5478;

  --radius: 20px;
}


/* =========================================================
   RESET
========================================================= */

* {
  box-sizing: border-box;
}

html {
  background: var(--bg);
}

body {
  margin: 0;
  min-height: 100vh;

  color: var(--white);

  background:
    #05060a;

  font-family:
    Inter,
    Arial,
    sans-serif;

  overflow-x: hidden;
}

button,
input {
  font: inherit;
}

button {
  cursor: pointer;
}

::selection {
  background: #765cff;
  color: white;
}


/* =========================================================
   SHARP BACKGROUND
   NO FILTER
   NO BLUR
========================================================= */

.background {
  position: fixed;
  inset: 0;
  z-index: -10;

  pointer-events: none;

  overflow: hidden;

  background:
    linear-gradient(
      180deg,
      #06070c 0%,
      #05060a 50%,
      #06070b 100%
    );
}


/* Sharp perspective grid */

.grid {
  position: absolute;

  left: -20%;
  right: -20%;
  bottom: -18%;

  height: 55%;

  opacity: 0.18;

  transform:
    perspective(650px)
    rotateX(62deg);

  transform-origin:
    center bottom;

  background-image:
    linear-gradient(
      rgba(121, 94, 255, 0.32) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(121, 94, 255, 0.32) 1px,
      transparent 1px
    );

  background-size:
    70px 70px;

  mask-image:
    linear-gradient(
      to top,
      black,
      transparent
    );
}


/* Tiny stars */

.stars {
  position: absolute;
  inset: 0;

  opacity: 0.35;

  background-image:
    radial-gradient(
      circle at 10% 20%,
      #ffffff 1px,
      transparent 1.5px
    ),
    radial-gradient(
      circle at 30% 65%,
      #7f72ff 1px,
      transparent 1.5px
    ),
    radial-gradient(
      circle at 70% 25%,
      #ffffff 1px,
      transparent 1.5px
    ),
    radial-gradient(
      circle at 84% 70%,
      #62e5ff 1px,
      transparent 1.5px
    ),
    radial-gradient(
      circle at 52% 45%,
      #ffffff 1px,
      transparent 1.5px
    );

  background-size:
    230px 230px,
    310px 310px,
    270px 270px,
    350px 350px,
    420px 420px;
}


/* Sharp decorative corners */

.corner {
  position: absolute;

  width: 240px;
  height: 240px;

  border: 1px solid
    rgba(120, 95, 255, 0.10);

  transform: rotate(45deg);
}

.corner.one {
  left: -180px;
  top: 100px;
}

.corner.two {
  right: -180px;
  top: 330px;
}

.corner.three {
  left: 45%;
  bottom: -190px;
}


/* =========================================================
   HEADER
========================================================= */

.header {
  width:
    min(
      1180px,
      calc(100% - 40px)
    );

  height: 82px;

  margin: 0 auto;

  display: flex;

  align-items: center;

  justify-content: space-between;
}


.logo {
  display: flex;

  align-items: center;

  gap: 12px;

  color: white;

  text-decoration: none;
}


.logo-mark {
  width: 40px;
  height: 40px;

  display: grid;

  place-items: center;

  border-radius: 12px;

  background:
    linear-gradient(
      135deg,
      #8c72ff,
      #5743e1
    );

  box-shadow:
    0 0 30px
    rgba(108, 82, 255, 0.22);
}


.logo-mark::before {
  content: "";

  width: 15px;
  height: 15px;

  border:
    2px solid white;

  border-radius: 4px;

  transform:
    rotate(45deg);
}


.logo-name {
  font-size: 15px;

  font-weight: 900;

  letter-spacing:
    -0.05em;
}


.logo-name span {
  color:
    var(--purple);
}


.engine {
  display: flex;

  align-items: center;

  gap: 8px;

  padding:
    8px 12px;

  border:
    1px solid var(--line-2);

  border-radius: 999px;

  background:
    #080a0f;

  color:
    #777a86;

  font-family:
    "DM Mono",
    monospace;

  font-size:
    9px;

  text-transform:
    uppercase;

  letter-spacing:
    .08em;
}


.engine-dot {
  width: 7px;
  height: 7px;

  border-radius: 50%;

  background:
    var(--green);

  box-shadow:
    0 0 12px
    rgba(57,223,165,.7);
}


/* =========================================================
   MAIN
========================================================= */

.main {
  width:
    min(
      1180px,
      calc(100% - 40px)
    );

  margin: 0 auto;

  padding-bottom:
    100px;
}


/* =========================================================
   HERO
========================================================= */

.hero {
  text-align: center;

  padding:
    75px 0
    45px;
}


.hero-tag {
  display: inline-flex;

  align-items: center;

  gap: 8px;

  padding:
    8px 13px;

  border:
    1px solid
    #292541;

  border-radius:
    999px;

  background:
    #0c0a14;

  color:
    #a89bff;

  font-family:
    "DM Mono",
    monospace;

  font-size:
    9px;

  text-transform:
    uppercase;

  letter-spacing:
    .08em;
}


.hero-tag span {
  color:
    var(--cyan);
}


.hero h1 {
  max-width:
    1000px;

  margin:
    25px auto
    0;

  font-size:
    clamp(
      52px,
      8vw,
      92px
    );

  line-height:
    .9;

  letter-spacing:
    -.085em;

  font-weight:
    900;
}


.hero-title-gradient {
  color:
    var(--purple);

  background:
    linear-gradient(
      100deg,
      #927aff,
      #6b5cff,
      #67e4ff
    );

  -webkit-background-clip:
    text;

  background-clip:
    text;

  -webkit-text-fill-color:
    transparent;
}


.hero p {
  max-width:
    630px;

  margin:
    27px auto 0;

  color:
    var(--muted);

  font-size:
    15px;

  line-height:
    1.75;
}


.hero p strong {
  color:
    #d8d5df;
}


/* =========================================================
   MAIN CONVERTER
========================================================= */

.converter-shell {
  width:
    min(
      940px,
      100%
    );

  margin:
    0 auto;

  padding:
    1px;

  border-radius:
    26px;

  background:
    linear-gradient(
      135deg,
      #3b3062,
      #171923 40%,
      #243b45
    );

  box-shadow:
    0 40px 90px
    rgba(0,0,0,.48);
}


.converter {
  padding:
    11px;

  border-radius:
    25px;

  background:
    #090b10;
}


/* =========================================================
   UPLOAD
========================================================= */

.upload {
  position:
    relative;

  min-height:
    410px;

  display:
    flex;

  flex-direction:
    column;

  align-items:
    center;

  justify-content:
    center;

  text-align:
    center;

  padding:
    25px;

  border:
    1px dashed
    #363a4b;

  border-radius:
    19px;

  background:
    #0e1016;

  transition:
    .18s ease;
}


.upload:hover {
  border-color:
    #50496f;
}


.upload.dragging {
  border-color:
    var(--purple);

  background:
    #11101b;

  box-shadow:
    inset 0 0 0 1px
    rgba(130,103,255,.2),
    0 0 45px
    rgba(100,75,230,.12);
}


/* =========================================================
   UPLOAD ICON
========================================================= */

.upload-visual {
  position:
    relative;

  width:
    108px;

  height:
    108px;

  margin-bottom:
    24px;

  display:
    grid;

  place-items:
    center;
}


.upload-orbit {
  position:
    absolute;

  inset:
    0;

  border:
    1px solid
    rgba(130,103,255,.35);

  border-radius:
    50%;

  border-top-color:
    var(--purple);

  transform:
    rotate(20deg);
}


.upload-orbit.two {
  inset:
    10px;

  border-color:
    rgba(98,229,255,.25);

  border-right-color:
    var(--cyan);

  transform:
    rotate(-35deg);
}


.upload-icon {
  width:
    64px;

  height:
    64px;

  display:
    grid;

  place-items:
    center;

  border-radius:
    18px;

  background:
    linear-gradient(
      135deg,
      #8971ff,
      #5743df
    );

  box-shadow:
    0 16px 40px
    rgba(87,67,223,.35);
}


.upload-icon svg {
  width:
    30px;

  height:
    30px;

  fill:
    none;

  stroke:
    white;

  stroke-width:
    1.7;

  stroke-linecap:
    round;

  stroke-linejoin:
    round;
}


/* =========================================================
   UPLOAD TEXT
========================================================= */

.upload h2 {
  position:
    relative;

  margin:
    0;

  font-size:
    23px;

  letter-spacing:
    -.045em;

  font-weight:
    800;
}


.upload-subtitle {
  position:
    relative;

  margin:
    10px 0
    23px;

  color:
    #686b77;

  font-size:
    12px;
}


.upload-subtitle strong {
  color:
    #b7b3bf;
}


/* =========================================================
   BUTTON
========================================================= */

.choose-button {
  position:
    relative;

  z-index:
    10;

  min-width:
    190px;

  height:
    51px;

  padding:
    0 22px;

  border:
    0;

  border-radius:
    13px;

  background:
    linear-gradient(
      135deg,
      #896fff,
      #5945e0
    );

  color:
    white;

  font-size:
    12px;

  font-weight:
    800;

  box-shadow:
    0 14px 35px
    rgba(89,69,224,.32);

  transition:
    transform .15s ease,
    box-shadow .15s ease;
}


.choose-button:hover {
  transform:
    translateY(-2px);

  box-shadow:
    0 20px 45px
    rgba(89,69,224,.45);
}


.choose-button:active {
  transform:
    translateY(0);
}


.choose-button:focus-visible {
  outline:
    3px solid
    rgba(98,229,255,.45);

  outline-offset:
    4px;
}


.upload-note {
  margin-top:
    15px;

  color:
    #454852;

  font-family:
    "DM Mono",
    monospace;

  font-size:
    8px;

  text-transform:
    uppercase;

  letter-spacing:
    .08em;
}


/* =========================================================
   HIDDEN INPUT
========================================================= */

#fileInput {
  position:
    absolute;

  width:
    1px;

  height:
    1px;

  opacity:
    0;

  pointer-events:
    none;
}


/* =========================================================
   OPTIONS
========================================================= */

.options {
  min-height:
    62px;

  display:
    flex;

  align-items:
    center;

  justify-content:
    space-between;

  gap:
    20px;

  padding:
    8px 5px 0;
}


.private {
  display:
    flex;

  align-items:
    center;

  gap:
    8px;

  color:
    #626570;

  font-size:
    10px;
}


.private svg {
  width:
    15px;

  height:
    15px;

  fill:
    none;

  stroke:
    var(--green);

  stroke-width:
    1.7;
}


.quality {
  display:
    flex;

  align-items:
    center;

  gap:
    10px;

  color:
    #696c78;

  font-family:
    "DM Mono",
    monospace;

  font-size:
    9px;

  text-transform:
    uppercase;
}


.quality input {
  width:
    110px;

  accent-color:
    var(--purple);
}


.quality-value {
  width:
    40px;

  color:
    #dedbe4;
}


/* =========================================================
   RESULTS
========================================================= */

.results {
  display:
    none;

  padding-top:
    10px;
}


.results.visible {
  display:
    block;
}


.results-head {
  display:
    flex;

  align-items:
    center;

  justify-content:
    space-between;

  min-height:
    48px;

  padding:
    0 4px
    10px;
}


.count {
  color:
    #70737f;

  font-size:
    11px;
}


.count strong {
  color:
    white;
}


.download-all {
  display:
    inline-flex;

  align-items:
    center;

  gap:
    7px;

  height:
    37px;

  padding:
    0 14px;

  border:
    1px solid
    #2a2d39;

  border-radius:
    10px;

  background:
    #11131a;

  color:
    #aaa9b4;

  font-size:
    10px;

  font-weight:
    700;
}


.download-all:hover {
  color:
    white;

  border-color:
    #584d82;
}


.download-all svg {
  width:
    14px;

  height:
    14px;

  fill:
    none;

  stroke:
    currentColor;

  stroke-width:
    1.8;
}


/* =========================================================
   FILE LIST
========================================================= */

.file-list {
  display:
    grid;

  gap:
    8px;
}


.file-card {
  min-height:
    78px;

  display:
    grid;

  grid-template-columns:
    56px
    minmax(0,1fr)
    auto;

  align-items:
    center;

  gap:
    13px;

  padding:
    10px;

  border:
    1px solid
    #1d2029;

  border-radius:
    14px;

  background:
    #101218;
}


.thumbnail {
  width:
    56px;

  height:
    56px;

  display:
    grid;

  place-items:
    center;

  overflow:
    hidden;

  border-radius:
    10px;

  background:
    #080a0e;

  color:
    #575b69;

  font-family:
    "DM Mono",
    monospace;

  font-size:
    8px;
}


.thumbnail img {
  display:
    block;

  width:
    100%;

  height:
    100%;

  object-fit:
    cover;
}


.file-info {
  min-width:
    0;
}


.file-name {
  overflow:
    hidden;

  white-space:
    nowrap;

  text-overflow:
    ellipsis;

  color:
    #dfdce5;

  font-size:
    11px;

  font-weight:
    700;
}


.file-meta {
  display:
    flex;

  flex-wrap:
    wrap;

  align-items:
    center;

  gap:
    6px;

  margin-top:
    6px;

  color:
    #626570;

  font-family:
    "DM Mono",
    monospace;

  font-size:
    8px;
}


.file-status {
  display:
    flex;

  align-items:
    center;

  gap:
    8px;

  color:
    #7b7e89;

  font-size:
    10px;
}


.spinner {
  width:
    15px;

  height:
    15px;

  border:
    2px solid
    #292c37;

  border-top-color:
    var(--purple);

  border-radius:
    50%;

  animation:
    spin .7s linear infinite;
}


@keyframes spin {
  to {
    transform:
      rotate(360deg);
  }
}


.success {
  width:
    21px;

  height:
    21px;

  display:
    grid;

  place-items:
    center;

  border-radius:
    50%;

  background:
    var(--green);

  color:
    #06120d;

  font-size:
    11px;

  font-weight:
    900;
}


.error {
  width:
    21px;

  height:
    21px;

  display:
    grid;

  place-items:
    center;

  border-radius:
    50%;

  background:
    var(--red);

  color:
    white;

  font-size:
    11px;
}


.download-one {
  width:
    36px;

  height:
    36px;

  display:
    grid;

  place-items:
    center;

  border:
    1px solid
    #292c37;

  border-radius:
    9px;

  background:
    #12141b;

  color:
    #999ba6;
}


.download-one:hover {
  color:
    white;

  border-color:
    #5b4f85;
}


.download-one svg {
  width:
    15px;

  height:
    15px;

  fill:
    none;

  stroke:
    currentColor;

  stroke-width:
    1.8;
}


/* =========================================================
   ENGINE ERROR
========================================================= */

.engine-error {
  display:
    none;

  margin-top:
    10px;

  padding:
    13px;

  border:
    1px solid
    rgba(255,84,120,.25);

  border-radius:
    10px;

  background:
    #140b10;

  color:
    #ff8ca4;

  font-size:
    10px;

  text-align:
    center;
}


.engine-error.show {
  display:
    block;
}


/* =========================================================
   FEATURES
========================================================= */

.features {
  width:
    min(
      940px,
      100%
    );

  margin:
    60px auto 0;

  display:
    grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:
    10px;
}


.feature {
  min-height:
    175px;

  padding:
    23px;

  border:
    1px solid
    #181b23;

  border-radius:
    17px;

  background:
    #090b10;
}


.feature:hover {
  border-color:
    #292d3a;

  background:
    #0b0d13;
}


.feature-icon {
  width:
    36px;

  height:
    36px;

  display:
    grid;

  place-items:
    center;

  margin-bottom:
    17px;

  border:
    1px solid
    #242834;

  border-radius:
    10px;

  background:
    #11131a;

  color:
    var(--purple);
}


.feature-icon svg {
  width:
    18px;

  height:
    18px;

  fill:
    none;

  stroke:
    currentColor;

  stroke-width:
    1.7;

  stroke-linecap:
    round;

  stroke-linejoin:
    round;
}


.feature h3 {
  margin:
    0 0 7px;

  color:
    #d8d5de;

  font-size:
    12px;
}


.feature p {
  margin:
    0;

  color:
    #626570;

  font-size:
    10px;

  line-height:
    1.7;
}


/* =========================================================
   FINAL
========================================================= */

.final {
  padding:
    90px 20px
    10px;

  text-align:
    center;
}


.final-line {
  width:
    38px;

  height:
    1px;

  margin:
    0 auto 22px;

  background:
    var(--purple);

  box-shadow:
    0 0 18px
    rgba(130,103,255,.6);
}


.final h2 {
  margin:
    0;

  font-size:
    clamp(
      28px,
      4vw,
      40px
    );

  line-height:
    1.05;

  letter-spacing:
    -.06em;
}


.final p {
  max-width:
    520px;

  margin:
    15px auto 0;

  color:
    #60636e;

  font-size:
    11px;

  line-height:
    1.7;
}


/* =========================================================
   FOOTER
========================================================= */

.footer {
  width:
    min(
      1180px,
      calc(100% - 40px)
    );

  margin:
    0 auto;

  padding:
    27px 0
    35px;

  border-top:
    1px solid
    #151820;

  display:
    flex;

  justify-content:
    space-between;

  gap:
    20px;

  color:
    #454852;

  font-family:
    "DM Mono",
    monospace;

  font-size:
    8px;

  text-transform:
    uppercase;

  letter-spacing:
    .06em;
}


/* =========================================================
   TOAST
========================================================= */

.toast {
  position:
    fixed;

  z-index:
    100;

  left:
    50%;

  bottom:
    24px;

  transform:
    translate(-50%,80px);

  opacity:
    0;

  padding:
    12px 16px;

  border:
    1px solid
    #292d39;

  border-radius:
    11px;

  background:
    #101219;

  color:
    #d8d6de;

  font-size:
    10px;

  transition:
    .22s ease;

  pointer-events:
    none;
}


.toast.visible {
  transform:
    translate(-50%,0);

  opacity:
    1;
}


.toast-dot {
  display:
    inline-block;

  width:
    7px;

  height:
    7px;

  margin-right:
    8px;

  border-radius:
    50%;

  background:
    var(--green);

  box-shadow:
    0 0 10px
