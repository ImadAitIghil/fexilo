<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<title>HEICX — HEIC to JPG Converter</title>

<meta
  name="description"
  content="Convert HEIC and HEIF photos to maximum-quality JPG images instantly. Private browser-based conversion with no uploads."
>

<meta
  name="theme-color"
  content="#05060a"
/>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- HEIC conversion engine -->
<script
  src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"

<style>

/* =========================================================
   CORE
========================================================= */

:root {
  --bg: #05060a;
  --panel: #0b0d13;
  --panel-2: #0e1017;
  --panel-3: #11131b;

  --line: #1b1e29;
  --line-bright: #2b2d3d;

  --text: #ffffff;
  --muted: #727582;
  --muted-2: #50525d;

  --purple: #8267ff;
  --purple-2: #6049ed;

  --cyan: #61e4ff;
  --green: #36dfa2;
  --red: #ff587d;

  --radius: 22px;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;

  background:
    radial-gradient(
      circle at 10% 0%,
      rgba(91, 66, 255, 0.12),
      transparent 27%
    ),
    radial-gradient(
      circle at 92% 16%,
      rgba(0, 206, 255, 0.07),
      transparent 24%
    ),
    var(--bg);

  color: var(--text);

  font-family:
    Inter,
    Arial,
    sans-serif;

  overflow-x: hidden;
}

button,
input {
  font: inherit;
}

button {
  cursor: pointer;
}

::selection {
  background: #7960ff;
  color: white;
}


/* =========================================================
   BACKGROUND WORLD
========================================================= */

.world {
  position: fixed;
  inset: 0;

  z-index: -10;

  pointer-events: none;

  overflow: hidden;
}

.world-grid {
  position: absolute;

  width: 160%;
  height: 55%;

  left: -30%;
  bottom: -30%;

  opacity: 0.09;

  transform:
    perspective(500px)
    rotateX(62deg);

  background-image:
    linear-gradient(
      rgba(125, 99, 255, 0.6) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(125, 99, 255, 0.6) 1px,
      transparent 1px
    );

  background-size: 60px 60px;

  animation:
    gridMove 14s linear infinite;
}

@keyframes gridMove {
  from {
    background-position: 0 0, 0 0;
  }

  to {
    background-position: 0 60px, 60px 0;
  }
}


.stars {
  position: absolute;
  inset: 0;

  opacity: 0.25;

  background-image:
    radial-gradient(
      circle,
      rgba(255,255,255,0.75) 1px,
      transparent 1px
    );

  background-size: 110px 110px;
}


.orb {
  position: absolute;

  border-radius: 50%;

  pointer-events: none;
}

.orb-purple {
  width: 430px;
  height: 430px;

  left: -230px;
  top: -190px;

  background:
    rgba(108, 77, 255, 0.10);

  filter: blur(80px);
}

.orb-cyan {
  width: 360px;
  height: 360px;

  right: -200px;
  top: 160px;

  background:
    rgba(0, 210, 255, 0.07);

  filter: blur(80px);
}

.orb-pink {
  width: 300px;
  height: 300px;

  left: 45%;
  bottom: -250px;

  background:
    rgba(255, 0, 151, 0.06);

  filter: blur(80px);
}


/* =========================================================
   HEADER
========================================================= */

.header {
  width:
    min(
      1180px,
      calc(100% - 40px)
    );

  height: 82px;

  margin: 0 auto;

  display: flex;

  align-items: center;

  justify-content: space-between;
}

.logo {
  display: flex;

  align-items: center;

  gap: 12px;

  color: white;

  text-decoration: none;
}

.logo-mark {
  position: relative;

  width: 40px;
  height: 40px;

  display: grid;

  place-items: center;

  border-radius: 13px;

  background:
    linear-gradient(
      135deg,
      #9278ff,
      #5643e4
    );

  box-shadow:
    0 0 35px
    rgba(113, 83, 255, 0.28);
}

.logo-mark::before {
  content: "";

  width: 14px;
  height: 14px;

  border:
    2px solid white;

  border-radius: 4px;

  transform: rotate(45deg);
}

.logo-name {
  font-size: 15px;

  font-weight: 900;

  letter-spacing: -0.04em;
}

.logo-name span {
  color: var(--purple);
}


.engine-status {
  display: flex;

  align-items: center;

  gap: 8px;

  padding:
    8px 12px;

  border:
    1px solid #20232d;

  border-radius: 999px;

  background:
    #0a0c11;

  color: #777a87;

  font-family:
    "DM Mono",
    monospace;

  font-size: 9px;

  text-transform: uppercase;

  letter-spacing: 0.08em;
}

.status-light {
  width: 7px;
  height: 7px;

  border-radius: 50%;

  background:
    var(--green);

  box-shadow:
    0 0 12px
    rgba(54,223,162,0.75);
}


/* =========================================================
   MAIN
========================================================= */

.main {
  width:
    min(
      1180px,
      calc(100% - 40px)
    );

  margin: 0 auto;

  padding-bottom: 110px;
}


/* =========================================================
   HERO
========================================================= */

.hero {
  text-align: center;

  padding:
    78px 0
    45px;
}

.hero-chip {
  display: inline-flex;

  align-items: center;

  gap: 8px;

  padding:
    8px 13px;

  border:
    1px solid #292541;

  border-radius: 999px;

  background:
    #0d0b16;

  color:
    #a79aff;

  font-family:
    "DM Mono",
    monospace;

  font-size: 9px;

  text-transform:
    uppercase;

  letter-spacing:
    0.08em;
}

.hero-chip .spark {
  color: var(--cyan);
}

.hero h1 {
  max-width: 950px;

  margin:
    26px auto
    0;

  font-size:
    clamp(
      50px,
      8vw,
      92px
    );

  line-height:
    0.92;

  letter-spacing:
    -0.08em;

  font-weight:
    900;
}

.hero-gradient {
  background:
    linear-gradient(
      105deg,
      #ffffff 5%,
      #9d87ff 35%,
      #69e7ff 65%,
      #ffffff 92%
    );

  background-size:
    220% auto;

  -webkit-background-clip:
    text;

  background-clip:
    text;

  color:
    transparent;

  animation:
    gradientMove 8s
    linear infinite;
}

@keyframes gradientMove {
  to {
    background-position:
      220% center;
  }
}

.hero-description {
  max-width: 620px;

  margin:
    26px auto
    0;

  color:
    var(--muted);

  font-size:
    15px;

  line-height:
    1.75;
}

.hero-description strong {
  color:
    #d9d6e1;
}


/* =========================================================
   CONVERTER FRAME
========================================================= */

.converter-frame {
  width:
    min(
      940px,
      100%
    );

  margin:
    0 auto;

  padding:
    1px;

  border-radius:
    28px;

  background:
    linear-gradient(
      135deg,
      #332a50,
      #151721 42%,
      #18323d
    );

  box-shadow:
    0 50px 120px
    rgba(0,0,0,0.55);
}

.converter {
  padding:
    12px;

  border-radius:
    27px;

  background:
    #090b10;
}


/* =========================================================
   UPLOAD AREA
========================================================= */

.upload-zone {
  position: relative;

  min-height:
    410px;

  overflow: hidden;

  display: flex;

  flex-direction:
    column;

  align-items:
    center;

  justify-content:
    center;

  text-align:
    center;

  border:
    1px dashed
    #323449;

  border-radius:
    21px;

  background:
    #0e1016;

  transition:
    border-color 0.2s ease,
    background 0.2s ease,
    transform 0.2s ease;
}

.upload-zone::before {
  content: "";

  position: absolute;

  inset: 0;

  pointer-events: none;

  background:
    radial-gradient(
      circle at 50% 35%,
      rgba(111, 80, 255, 0.11),
      transparent 42%
    );
}

.upload-zone.dragging {
  border-color:
    #8065ff;

  background:
    #10101a;

  transform:
    scale(0.995);
}


/* =========================================================
   UPLOAD CORE
========================================================= */

.upload-core {
  position: relative;

  width:
    104px;

  height:
    104px;

  display:
    grid;

  place-items:
    center;

  margin-bottom:
    24px;
}

.upload-ring {
  position: absolute;

  inset: 0;

  border:
    1px solid
    rgba(128,101,255,0.25);

  border-radius:
    50%;

  animation:
    ringRotate 9s
    linear infinite;
}

.upload-ring::before {
  content: "";

  position: absolute;

  top:
    -3px;

  left:
    50%;

  width:
    6px;

  height:
    6px;

  border-radius:
    50%;

  background:
    #8d76ff;

  box-shadow:
    0 0 15px
    #8065ff;
}

.upload-ring::after {
  content: "";

  position: absolute;

  right:
    -3px;

  bottom:
    22px;

  width:
    6px;

  height:
    6px;

  border-radius:
    50%;

  background:
    var(--cyan);

  box-shadow:
    0 0 15px
    var(--cyan);
}

@keyframes ringRotate {
  to {
    transform:
      rotate(360deg);
  }
}

.upload-icon {
  position: relative;

  width:
    64px;

  height:
    64px;

  display:
    grid;

  place-items:
    center;

  border-radius:
    19px;

  background:
    linear-gradient(
      145deg,
      #866cff,
      #5541d8
    );

  box-shadow:
    0 18px 45px
    rgba(91,68,230,0.32);
}

.upload-icon svg {
  width:
    29px;

  height:
    29px;

  fill:
    none;

  stroke:
    white;

  stroke-width:
    1.7;

  stroke-linecap:
    round;

  stroke-linejoin:
    round;
}


/* =========================================================
   UPLOAD COPY
========================================================= */

.upload-zone h2 {
  position: relative;

  margin:
    0;

  font-size:
    23px;

  font-weight:
    800;

  letter-spacing:
    -0.045em;
}

.upload-subtitle {
  position: relative;

  margin:
    10px 0
    23px;

  color:
    #696b77;

  font-size:
    12px;
}

.upload-subtitle strong {
  color:
    #b5b2bd;
}


/* =========================================================
   REAL UPLOAD BUTTON
========================================================= */

#chooseButton {
  position: relative;

  z-index: 5;

  height:
    50px;

  min-width:
    182px;

  padding:
    0 22px;

  border:
    0;

  border-radius:
    13px;

  background:
    linear-gradient(
      135deg,
      #856aff,
      #5946e0
    );

  color:
    white;

  font-size:
    12px;

  font-weight:
    800;

  box-shadow:
    0 14px 35px
    rgba(88,67,218,0.32);

  transition:
    transform 0.18s ease,
    box-shadow 0.18s ease;
}

#chooseButton:hover {
  transform:
    translateY(-2px);

  box-shadow:
    0 20px 45px
    rgba(88,67,218,0.42);
}

#chooseButton:active {
  transform:
    translateY(0);
}

#chooseButton:focus-visible {
  outline:
    3px solid
    rgba(105,228,255,0.5);

  outline-offset:
    4px;
}

.upload-note {
  position: relative;

  margin-top:
    15px;

  color:
    #464853;

  font-family:
    "DM Mono",
    monospace;

  font-size:
    8px;

  text-transform:
    uppercase;

  letter-spacing:
    0.08em;
}

#fileInput {
  position:
    absolute;

  width:
    1px;

  height:
    1px;

  opacity:
    0;

  pointer-events:
    none;
}


/* =========================================================
   OPTIONS
========================================================= */

.converter-options {
  min-height:
    60px;

  padding:
    8px 5px
    0;

  display:
    flex;

  align-items:
    center;

  justify-content:
    space-between;

  gap:
    20px;
}

.private-message {
  display:
    flex;

  align-items:
    center;

  gap:
    8px;

  color:
    #60626d;

  font-size:
    10px;
}

.private-message svg {
  width:
    15px;

  height:
    15px;

  fill:
    none;

  stroke:
    var(--green);

  stroke-width:
    1.7;
}

.quality-control {
  display:
    flex;

  align-items:
    center;

  gap:
    10px;

  color:
    #666874;

  font-family:
    "DM Mono",
    monospace;

  font-size:
    9px;

  text-transform:
    uppercase;
}

.quality-control input {
  width:
    100px;

  accent-color:
    var(--purple);
}

.quality-value {
  width:
    36px;

  color:
    #d0ccd7;

  font-weight:
    500;
}


/* =========================================================
   RESULTS
========================================================= */

.results {
  display:
    none;

  padding-top:
    10px;
}

.results.show {
  display:
    block;
}

.results-heading {
  min-height:
    48px;

  display:
    flex;

  align-items:
    center;

  justify-content:
    space-between;

  padding:
    0 4px
    10px;
}

.result-count {
  color:
    #747682;

  font-size:
    11px;
}

.result-count strong {
  color:
    white;
}

.download-all {
  height:
    37px;

  display:
    inline-flex;

  align-items:
    center;

  gap:
    7px;

  padding:
    0 14px;

  border:
    1px solid
    #292c38;

  border-radius:
    10px;

  background:
    #11131a;

  color:
    #aaa9b5;

  font-size:
    10px;

  font-weight:
    700;
}

.download-all:hover {
  border-color:
    #51477a;

  color:
    white;
}

.download-all svg {
  width:
    14px;

  height:
    14px;

  fill:
    none;

  stroke:
    currentColor;

  stroke-width:
    1.8;
}


/* =========================================================
   FILE CARDS
========================================================= */

.file-list {
  display:
    grid;

  gap:
    8px;
}

.file-card {
  min-height:
    78px;

  display:
    grid;

  grid-template-columns:
    56px
    minmax(0,1fr)
    auto;

  align-items:
    center;

  gap:
    13px;

  padding:
    10px;

  border:
    1px solid
    #1d2029;

  border-radius:
    14px;

  background:
    #101218;
}

.file-thumb {
  width:
    56px;

  height:
    56px;

  display:
    grid;

  place-items:
    center;

  overflow:
    hidden;

  border-radius:
    10px;

  background:
    #080a0e;

  color:
    #555968;

  font-family:
    "DM Mono",
    monospace;

  font-size:
    8px;
}

.file-thumb img {
  display:
    block;

  width:
    100%;

  height:
    100%;

  object-fit:
    cover;
}

.file-info {
  min-width:
    0;
}

.file-name {
  overflow:
    hidden;

  white-space:
    nowrap;

  text-overflow:
    ellipsis;

  color:
    #dfdce5;

  font-size:
    11px;

  font-weight:
    700;
}

.file-meta {
  display:
    flex;

  align-items:
    center;

  gap:
    6px;

  margin-top:
    6px;

  color:
    #5f626d;

  font-family:
    "DM Mono",
    monospace;

  font-size:
    8px;
}

.file-status {
  display:
    flex;

  align-items:
    center;

  gap:
    8px;

  color:
    #777986;

  font-size:
    10px;
}

.spinner {
  width:
    15px;

  height:
    15px;

  border:
    2px solid
    #292b36;

  border-top-color:
    var(--purple);

  border-radius:
    50%;

  animation:
    spin 0.7s
    linear infinite;
}

@keyframes spin {
  to {
    transform:
      rotate(360deg);
  }
}

.success-icon {
  width:
    21px;

  height:
    21px;

  display:
    grid;

  place-items:
    center;

  border-radius:
    50%;

  background:
    var(--green);

  color:
    #06110c;

  font-size:
    11px;

  font-weight:
    900;
}

.error-icon {
  width:
    21px;

  height:
    21px;

  display:
    grid;

  place-items:
    center;

  border-radius:
    50%;

  background:
    var(--red);

  color:
    white;

  font-size:
    11px;
}

.download-one {
  width:
    36px;

  height:
    36px;

  display:
    grid;

  place-items:
    center;

  border:
    1px solid
    #292c36;

  border-radius:
    9px;

  background:
    #12141b;

  color:
    #9294a0;
}

.download-one:hover {
  color:
    white;

  border-color:
    #574c80;
}

.download-one svg {
  width:
    15px;

  height:
    15px;

  fill:
    none;

  stroke:
    currentColor;

  stroke-width:
    1.8;
}


/* =========================================================
   FEATURE SYSTEM
========================================================= */

.features {
  width:
    min(
      940px,
      100%
    );

  margin:
    60px auto
    0;

  display:
    grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap:
    10px;
}

.feature {
  position:
    relative;

  min-height:
    175px;

  padding:
    23px;

  overflow:
    hidden;

  border:
    1px solid
    #181b23;

  border-radius:
    17px;

  background:
    #090b10;
}

.feature::after {
  content:
    "";

  position:
    absolute;

  right:
    -50px;

  top:
    -50px;

  width:
    110px;

  height:
    110px;

  border-radius:
    50%;

  background:
    rgba(115,88,255,0.08);

  filter:
    blur(35px);
}

.feature-icon {
  width:
    36px;

  height:
    36px;

  display:
    grid;

  place-items:
    center;

  margin-bottom:
    17px;

  border-radius:
    10px;

  background:
    #12141c;

  color:
    var(--purple);
}

.feature-icon svg {
  width:
    18px;

  height:
    18px;

  fill:
    none;

  stroke:
    currentColor;

  stroke-width:
    1.7;

  stroke-linecap:
    round;

  stroke-linejoin:
    round;
}

.feature h3 {
  margin:
    0 0 7px;

  color:
    #d8d5de;

  font-size:
    12px;
}

.feature p {
  margin:
    0;

  color:
    #62646f;

  font-size:
    10px;

  line-height:
    1.7;
}


/* =========================================================
   FINAL
========================================================= */

.final {
  padding:
    90px 20px
    15px;

  text-align:
    center;
}

.final-line {
  width:
    38px;

  height:
    1px;

  margin:
    0 auto
    22px;

  background:
    var(--purple);
}

.final h2 {
  margin:
    0;

  font-size:
    clamp(
      27px,
      4vw,
      39px
    );

  line-height:
    1.05;

  letter-spacing:
    -0.06em;
}

.final p {
  max-width:
    520px;

  margin:
    15px auto
    0;

  color:
    #60626c;

  font-size:
    11px;

  line-height:
    1.7;
}


/* =========================================================
   FOOTER
========================================================= */

.footer {
  width:
    min(
      1180px,
      calc(100% - 40px)
    );

  margin:
    0 auto;

  padding:
    26px 0
    35px;

  border-top:
    1px solid
    #151820;

  display:
    flex;

  justify-content:
    space-between;

  gap:
    20px;

  color:
    #444750;

  font-family:
    "DM Mono",
    monospace;

  font-size:
    8px;

  text-transform:
    uppercase;

  letter-spacing:
    0.06em;
}


/* =========================================================
   TOAST
========================================================= */

.toast {
  position:
    fixed;

  z-index:
    1000;

  left:
    50%;

  bottom:
    25px;

  transform:
    translate(-50%, 100px);

  opacity:
    0;

  padding:
    12px 16px;

  border:
    1px solid
    #292d39;

  border-radius:
    11px;

  background:
    #101219;

  color:
    #d8d6de;

  font-size:
    10px;

  transition:
    transform .25s ease,
    opacity .25s ease;

  pointer-events:
    none;
}

.toast.show {
  transform:
    translate(-50%, 0);

  opacity:
    1;
}

.toast.success .toast-dot {
  background:
    var(--green);
}

.toast.error .toast-dot {
  background:
    var(--red);
}

.toast-dot {
  display:
    inline-block;

  width:
    7px;

  height:
    7px;

  margin-right:
    8px;

  border-radius:
    50%;

  background:
    var(--purple);
}

   ENGINE ERROR
========================================================= */

.engine-error {
  display:
    none;

  margin:
    10px 0
    0;

  padding:
    12px;

  border:
    1px solid
    rgba(255,88,125,0.25);

  border-radius:
    10px;

  background:
    rgba(255,88,125,0.05);

  color:
    #ff91aa;

  font-size:
    10px;

  text-align:
    center;
}

.engine-error.show {
  display:
    block;
}
