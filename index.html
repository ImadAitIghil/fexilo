<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fexilo – Free HEIC to JPG Converter</title>

  <meta
    name="description"
    content="Convert HEIC and HEIF photos to JPG directly in your browser. Free, private and secure. No uploads."
  >

  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#4f46e5">

  <!-- HEIC converter -->
  <script src="https://cdn.jsdelivr.net/npm/heic-to@1.1.1/dist/iife/heic-to.js"></script>

  <!-- ZIP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f9fafb;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --success: #059669;
      --danger: #dc2626;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background: var(--bg);
      color: var(--text);
      min-height: 100vh;

      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 20px;
      text-align: center;
    }

    header h1 {
      color: var(--primary);
      font-size: 26px;
      font-weight: 800;
    }

    header p {
      color: var(--muted);
      font-size: 14px;
      margin-top: 4px;
    }

    main {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 24px 16px 50px;
      flex: 1;
    }

    .drop-zone {
      border: 2px dashed #c7d2fe;
      background: #eef2ff;
      border-radius: var(--radius);
      padding: 48px 20px;
      text-align: center;
      transition: 0.2s;
    }

    .drop-zone.dragover {
      border-color: var(--primary);
      background: #e0e7ff;
    }

    .drop-zone h2 {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .drop-zone p {
      color: var(--muted);
      font-size: 14px;
    }

    input[type="file"] {
      display: none;
    }

    .btn {
      border: 0;
      border-radius: 9px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;

      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;

      transition:
        background 0.15s,
        transform 0.1s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: white;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: #f3f4f6;
    }

    .select-button {
      margin-top: 18px;
    }

    .results {
      display: none;
      margin-top: 24px;
    }

    .results.visible {
      display: block;
    }

    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .results-header h2 {
      font-size: 19px;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .file-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .file-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;

      display: flex;
      align-items: center;
      gap: 14px;
    }

    .preview {
      width: 80px;
      height: 80px;
      border-radius: 10px;
      object-fit: cover;
      background: #f3f4f6;
      flex-shrink: 0;
    }

    .file-info {
      min-width: 0;
      flex: 1;
    }

    .file-name {
      font-size: 14px;
      font-weight: 700;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-size {
      color: var(--muted);
      font-size: 12px;
      margin-top: 4px;
    }

    .status {
      font-size: 12px;
      margin-top: 4px;
    }

    .success {
      color: var(--success);
    }

    .error {
      color: var(--danger);
    }

    .file-action {
      flex-shrink: 0;
    }

    .privacy {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      margin-top: 28px;
      line-height: 1.5;
    }

    .privacy strong {
      color: var(--text);
    }

    footer {
      border-top: 1px solid var(--border);
      background: white;
      color: var(--muted);
      text-align: center;
      padding: 16px;
      font-size: 12px;
    }

    .loading {
      text-align: center;
    }

    .spinner {
      width: 28px;
      height: 28px;
      margin: 18px auto 0;

      border: 3px solid #c7d2fe;
      border-top-color: var(--primary);

      border-radius: 50%;

      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .error-box {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
      border-radius: 10px;
      padding: 12px;
      margin-top: 16px;
      font-size: 13px;
      display: none;
    }

    .error-box.visible {
      display: block;
    }

    @media (max-width: 600px) {

      main {
        padding: 18px 12px 40px;
      }

      .drop-zone {
        padding: 38px 15px;
      }

      .file-card {
        align-items: flex-start;
      }

      .preview {
        width: 70px;
        height: 70px;
      }

      .file-action .btn {
        padding: 9px 12px;
        font-size: 13px;
      }

      .actions {
        width: 100%;
      }

      .actions .btn {
        flex: 1;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Fexilo</h1>
  <p>Free private HEIC → JPG converter</p>
</header>

<main>

  <!-- UPLOAD AREA -->

  <div
    class="drop-zone"
    id="dropZone"
  >

    <h2>
      Convert HEIC / HEIF to JPG
    </h2>

    <p>
      Select one or multiple photos
    </p>

    <label
      for="fileInput"
      class="btn btn-primary select-button"
    >
      Select Files
    </label>

    <input
      id="fileInput"
      type="file"
      accept=".heic,.heif,image/heic,image/heif"
      multiple
    >

    <div
      id="errorBox"
      class="error-box"
    ></div>

  </div>


  <!-- RESULTS -->

  <section
    class="results"
    id="results"
  >

    <div class="results-header">

      <h2 id="resultsTitle">
        Converted
      </h2>

      <div
        class="actions"
        id="actions"
      ></div>

    </div>

    <div
      class="file-list"
      id="fileList"
    ></div>

    <div
      style="
        text-align:center;
        margin-top:20px;
      "
    >

      <button
        type="button"
        class="btn btn-secondary"
        id="startOverBtn"
      >
        Start Over
      </button>

    </div>

  </section>


  <!-- PRIVACY -->

  <p class="privacy">

    <strong>100% private.</strong>

    Your photos are converted directly
    in your browser.

    <br>

    No uploads. No accounts.
    No server processing.

  </p>

</main>


<footer>
  Fexilo • Free HEIC to JPG converter
</footer>


<script>

  // =========================================
  // SETTINGS
  // =========================================

  const QUALITY = 0.95;


  // =========================================
  // ELEMENTS
  // =========================================

  const dropZone =
    document.getElementById("dropZone");

  const fileInput =
    document.getElementById("fileInput");

  const results =
    document.getElementById("results");

  const resultsTitle =
    document.getElementById("resultsTitle");

  const actions =
    document.getElementById("actions");

  const fileList =
    document.getElementById("fileList");

  const startOverBtn =
    document.getElementById("startOverBtn");

  const errorBox =
    document.getElementById("errorBox");


  // =========================================
  // STATE
  // =========================================

  let convertedFiles = [];


  // =========================================
  // FILE NAME
  // =========================================

  function makeJpgName(name) {

    let clean =
      name
        .split("/")
        .pop()
        .split("\\")
        .pop();


    clean =
      clean.replace(
        /\.(heic|heif)$/i,
        ""
      );


    return clean + ".jpg";
  }


  // =========================================
  // FORMAT SIZE
  // =========================================

  function formatBytes(bytes) {

    if (bytes < 1024) {
      return bytes + " B";
    }

    if (bytes < 1024 * 1024) {

      return (
        (bytes / 1024).toFixed(1)
        + " KB"
      );

    }

    return (
      (bytes / (1024 * 1024)).toFixed(2)
      + " MB"
    );

  }


  // =========================================
  // CLEAN OLD URLS
  // =========================================

  function revokeUrls() {

    convertedFiles.forEach(
      file => {

        if (file.url) {
          URL.revokeObjectURL(file.url);
        }

      }
    );

  }


  // =========================================
  // FILE SELECT
  // =========================================

  fileInput.addEventListener(
    "change",
    function () {

      if (
        this.files &&
        this.files.length > 0
      ) {

        processFiles(this.files);

      }

    }
  );


  // =========================================
  // DRAG & DROP
  // =========================================

  dropZone.addEventListener(
    "dragover",
    function (event) {

      event.preventDefault();

      dropZone.classList.add(
        "dragover"
      );

    }
  );


  dropZone.addEventListener(
    "dragleave",
    function () {

      dropZone.classList.remove(
        "dragover"
      );

    }
  );


  dropZone.addEventListener(
    "drop",
    function (event) {

      event.preventDefault();

      dropZone.classList.remove(
        "dragover"
      );


      if (
        event.dataTransfer &&
        event.dataTransfer.files.length
      ) {

        processFiles(
          event.dataTransfer.files
        );

      }

    }
  );


  // =========================================
  // PROCESS
  // =========================================

  async function processFiles(
    fileCollection
  ) {

    const files =
      Array.from(fileCollection)
        .filter(
          file => {

            const name =
              file.name.toLowerCase();

            return (
              name.endsWith(".heic") ||
              name.endsWith(".heif")
            );

          }
        );


    if (files.length === 0) {

      errorBox.textContent =
        "Please select HEIC or HEIF images.";

      errorBox.classList.add(
        "visible"
      );

      return;

    }


    errorBox.classList.remove(
      "visible"
    );


    // Loading

    dropZone.innerHTML = `

      <div class="loading">

        <h2>
          Converting...
        </h2>

        <p>
          Please wait.
        </p>

        <div class="spinner"></div>

      </div>

    `;


    convertedFiles = [];


    for (
      const file of files
    ) {

      const result =
        await convertFile(file);

      convertedFiles.push(result);

    }


    renderResults();

  }


  // =========================================
  // CONVERT HEIC
  // =========================================

  async function convertFile(file) {

    const jpgName =
      makeJpgName(file.name);


    try {

      if (
        typeof HeicTo === "undefined"
      ) {

        throw new Error(
          "The HEIC converter could not be loaded. Check your internet connection and reload the page."
        );

      }


      console.log(
        "Converting:",
        file.name,
        file.type,
        file.size
      );


      const blob =
        await HeicTo({

          blob: file,

          type: "image/jpeg",

          quality: QUALITY

        });


      if (
        !blob ||
        blob.size === 0
      ) {

        throw new Error(
          "The converter returned an empty image."
        );

      }


      const url =
        URL.createObjectURL(blob);


      return {

        originalName:
          file.name,

        jpgName:
          jpgName,

        originalSize:
          file.size,

        convertedSize:
          blob.size,

        blob:
          blob,

        url:
          url,

        error:
          null

      };


    } catch (error) {

      console.error(
        "Fexilo conversion error:",
        error
      );


      return {

        originalName:
          file.name,

        jpgName:
          jpgName,

        originalSize:
          file.size,

        convertedSize:
          0,

        blob:
          null,

        url:
          null,

        error:
          error.message ||
          "Conversion failed."

      };

    }

  }


  // =========================================
  // RESULTS
  // =========================================

  function renderResults() {

    dropZone.style.display =
      "none";

    results.classList.add(
      "visible"
    );


    fileList.innerHTML = "";

    actions.innerHTML = "";


    const successful =
      convertedFiles.filter(
        file => file.blob
      );


    resultsTitle.textContent =
      successful.length === 1
        ? "1 file converted"
        : successful.length +
          " files converted";


    // =======================================
    // FILE CARDS
    // =======================================

    convertedFiles.forEach(
      (file, index) => {

        const card =
          document.createElement(
            "div"
          );

        card.className =
          "file-card";


        // Preview

        const img =
          document.createElement(
            "img"
          );

        img.className =
          "preview";

        img.alt =
          file.jpgName;


        if (file.url) {

          img.src =
            file.url;

        }


        // Information

        const info =
          document.createElement(
            "div"
          );

        info.className =
          "file-info";


        const name =
          document.createElement(
            "div"
          );

        name.className =
          "file-name";

        name.textContent =
          file.jpgName;


        const size =
          document.createElement(
            "div"
          );

        size.className =
          "file-size";


        if (file.blob) {

          size.textContent =
            formatBytes(
              file.originalSize
            )
            +
            " → "
            +
            formatBytes(
              file.convertedSize
            );

        }


        const status =
          document.createElement(
            "div"
          );

        status.className =
          file.error
            ? "status error"
            : "status success";


        status.textContent =
          file.error
            ? "Error: " + file.error
            : "Conversion complete";


        info.appendChild(name);

        info.appendChild(size);

        info.appendChild(status);


        // Action

        const action =
          document.createElement(
            "div"
          );

        action.className =
          "file-action";


        if (file.blob) {

          const button =
            document.createElement(
              "button"
            );

          button.type =
            "button";

          button.className =
            "btn btn-primary";

          button.textContent =
            "Download JPG";


          button.addEventListener(
            "click",
            function () {

              downloadFile(
                file.blob,
                file.jpgName
              );

            }
          );


          action.appendChild(
            button
          );

        }


        card.appendChild(img);

        card.appendChild(info);

        card.appendChild(action);

        fileList.appendChild(card);

      }
    );


    // =======================================
    // TOP BUTTONS
    // =======================================

    if (
      successful.length === 1
    ) {

      const button =
        document.createElement(
          "button"
        );

      button.type =
        "button";

      button.className =
        "btn btn-primary";

      button.textContent =
        "Download JPG";


      button.addEventListener(
        "click",
        function () {

          downloadFile(
            successful[0].blob,
            successful[0].jpgName
          );

        }
      );


      actions.appendChild(
        button
      );

    }


    if (
      successful.length > 1
    ) {

      const allButton =
        document.createElement(
          "button"
        );

      allButton.type =
        "button";

      allButton.className =
        "btn btn-primary";

      allButton.textContent =
        "Download All JPGs (" +
        successful.length +
        ")";


      allButton.addEventListener(
        "click",
        function () {

          downloadAll(
            successful
          );

        }
      );


      actions.appendChild(
        allButton
      );


      const zipButton =
        document.createElement(
          "button"
        );

      zipButton.type =
        "button";

      zipButton.className =
        "btn btn-secondary";

      zipButton.textContent =
        "Download as ZIP";


      zipButton.addEventListener(
        "click",
        function () {

          downloadZip(
            successful
          );

        }
      );


      actions.appendChild(
        zipButton
      );

    }

  }


  // =========================================
  // DOWNLOAD
  // =========================================

  function downloadFile(
    blob,
    filename
  ) {

    if (!blob) {
      return;
    }


    const url =
      URL.createObjectURL(blob);


    const link =
      document.createElement(
        "a"
      );


    link.href =
      url;

    link.download =
      filename;

    link.style.display =
      "none";


    document.body.appendChild(
      link
    );


    link.click();


    setTimeout(
      function () {

        link.remove();

        URL.revokeObjectURL(
          url
        );

      },
      1500
    );

  }


  // =========================================
  // DOWNLOAD ALL
  // =========================================

  async function downloadAll(
    files
  ) {

    for (
      let i = 0;
      i < files.length;
      i++
    ) {

      downloadFile(
        files[i].blob,
        files[i].jpgName
      );


      if (
        i < files.length - 1
      ) {

        await new Promise(
          resolve =>
            setTimeout(
              resolve,
              800
            )
        );

      }

    }

  }


  // =========================================
  // ZIP
  // =========================================

  async function downloadZip(
    files
  ) {

    if (
      typeof JSZip === "undefined"
    ) {

      alert(
        "ZIP library could not be loaded."
      );

      return;

    }


    try {

      const zip =
        new JSZip();


      files.forEach(
        file => {

          zip.file(
            file.jpgName,
            file.blob
          );

        }
      );


      const zipBlob =
        await zip.generateAsync({
          type: "blob"
        });


      downloadFile(
        zipBlob,
        "fexilo-jpgs.zip"
      );


    } catch (error) {

      console.error(
        "ZIP error:",
        error
      );

      alert(
        "Could not create ZIP."
