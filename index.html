<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fexilo – Private HEIC to JPG Converter</title>
  <meta name="description" content="Convert HEIC and HEIF photos to JPG privately in your browser. No uploads. Fast, free, and secure client-side conversion.">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="Fexilo – Private HEIC to JPG Converter">
  <meta property="og:description" content="Convert HEIC and HEIF photos to JPG privately in your browser. No uploads. Fast, free, and secure client-side conversion.">
  <meta property="og:type" content="website">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1115;
      --surface: #1a1d24;
      --surface2: #242830;
      --border: #2e333d;
      --text: #e8eaed;
      --text-muted: #9aa0a6;
      --accent: #4f8cff;
      --accent-hover: #3a7af0;
      --success: #34c759;
      --error: #ff453a;
      --radius: 12px;
      --shadow: 0 4px 24px rgba(0,0,0,0.35);
    }
    html { font-size: 16px; -webkit-text-size-adjust: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .header {
      padding: 1.25rem 1rem;
      text-align: center;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .logo {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text);
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }
    .logo span {
      background: linear-gradient(135deg, #4f8cff, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .tagline {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    .main {
      flex: 1;
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      padding: 1.5rem 1rem 3rem;
    }

    .privacy-note {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.875rem 1rem;
      font-size: 0.8125rem;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
      text-align: center;
    }
    .privacy-note strong { color: var(--success); }

    .upload-area {
      background: var(--surface);
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 2.5rem 1.25rem;
      text-align: center;
      transition: border-color 0.2s, background 0.2s;
    }
    .upload-area.dragover {
      border-color: var(--accent);
      background: rgba(79,140,255,0.08);
    }
    .upload-icon {
      font-size: 2.5rem;
      margin-bottom: 0.75rem;
      opacity: 0.7;
    }
    .upload-title {
      font-size: 1.125rem;
      font-weight: 600;
      margin-bottom: 0.35rem;
    }
    .upload-hint {
      font-size: 0.8125rem;
      color: var(--text-muted);
      margin-bottom: 1.25rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s, opacity 0.15s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }
    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-secondary {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover:not(:disabled) { background: #2c313a; }
    .btn-success {
      background: var(--success);
      color: #fff;
    }
    .btn-sm {
      padding: 0.5rem 0.9rem;
      font-size: 0.875rem;
    }
    .btn-block { width: 100%; }

    #fileInput {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }

    .status {
      margin-top: 1.25rem;
      text-align: center;
      font-size: 0.9375rem;
      min-height: 1.5em;
    }
    .status.loading { color: var(--accent); }
    .status.error { color: var(--error); }
    .status.success { color: var(--success); }

    .spinner {
      display: inline-block;
      width: 1.1em;
      height: 1.1em;
      border: 2px solid rgba(79,140,255,0.3);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: -0.15em;
      margin-right: 0.4em;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .results {
      margin-top: 1.5rem;
      display: none;
    }
    .results.visible { display: block; }

    .results-header {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-bottom: 1rem;
      justify-content: center;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      margin-bottom: 1rem;
      box-shadow: var(--shadow);
    }
    .card-preview {
      width: 100%;
      max-height: 280px;
      object-fit: contain;
      border-radius: 8px;
      background: #000;
      display: block;
      margin: 0 auto 0.85rem;
    }
    .card-meta {
      font-size: 0.8125rem;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
    }
    .card-meta strong { color: var(--text); }
    .card-meta div { margin-bottom: 0.2rem; }
    .card-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .card.error-card { border-color: var(--error); }
    .card.error-card .card-meta { color: var(--error); }

    .footer {
      text-align: center;
      padding: 1.25rem 1rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
    }

    @media (min-width: 480px) {
      .logo { font-size: 2rem; }
      .upload-area { padding: 3rem 2rem; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="logo">Fex<span>ilo</span></div>
    <div class="tagline">Private HEIC / HEIF → JPG Converter</div>
  </header>

  <main class="main">
    <div class="privacy-note">
      <strong>100% private.</strong> Conversion happens entirely in your browser. Photos are never uploaded to any server.
    </div>

    <div class="upload-area" id="uploadArea">
      <div class="upload-icon">📷</div>
      <div class="upload-title">Select HEIC or HEIF files</div>
      <div class="upload-hint">Supports multiple files · Works offline after load</div>
      <button type="button" class="btn btn-primary" id="selectBtn">Select Files</button>
    </div>

    <!-- Stable file input – never removed or recreated -->
    <input type="file" id="fileInput" accept=".heic,.heif,image/heic,image/heif" multiple>

    <div class="status" id="status"></div>

    <div class="results" id="results">
      <div class="results-header" id="resultsHeader"></div>
      <div id="cards"></div>
    </div>
  </main>

  <footer class="footer">
    Fexilo · Client-side only · No tracking · No uploads
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/heic-to@1.5.2/dist/iife/heic-to.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script>
    (function () {
      "use strict";

      const fileInput = document.getElementById("fileInput");
      const selectBtn = document.getElementById("selectBtn");
      const uploadArea = document.getElementById("uploadArea");
      const statusEl = document.getElementById("status");
      const resultsEl = document.getElementById("results");
      const resultsHeader = document.getElementById("resultsHeader");
      const cardsEl = document.getElementById("cards");

      let convertedItems = []; // { blob, url, name, origSize, jpgSize }
      let isConverting = false;

      // ---------- helpers ----------
      function formatBytes(bytes) {
        if (bytes === 0) return "0 B";
        const k = 1024;
        const sizes = ["B", "KB", "MB", "GB"];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + " " + sizes[i];
      }

      function isHeicByExtension(filename) {
        if (!filename) return false;
        const lower = filename.toLowerCase();
        return lower.endsWith(".heic") || lower.endsWith(".heif");
      }

      function safeJpgName(originalName) {
        if (!originalName) return "converted.jpg";
        return originalName.replace(/\.(heic|heif)$/i, ".jpg");
      }

      function setStatus(msg, type) {
        statusEl.textContent = "";
        statusEl.className = "status";
        if (!msg) return;
        if (type === "loading") {
          statusEl.classList.add("loading");
          const spin = document.createElement("span");
          spin.className = "spinner";
          statusEl.appendChild(spin);
          statusEl.appendChild(document.createTextNode(msg));
        } else {
          if (type) statusEl.classList.add(type);
          statusEl.textContent = msg;
        }
      }

      function revokeAllUrls() {
        convertedItems.forEach(function (item) {
          if (item.url) URL.revokeObjectURL(item.url);
        });
        convertedItems = [];
      }

      function downloadBlob(blob, filename) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        a.style.display = "none";
        document.body.appendChild(a);
        a.click();
        setTimeout(function () {
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, 150);
      }

      // ---------- UI builders ----------
      function renderResults() {
        cardsEl.innerHTML = "";
        resultsHeader.innerHTML = "";

        if (convertedItems.length === 0) {
          resultsEl.classList.remove("visible");
          return;
        }

        resultsEl.classList.add("visible");

        // Header buttons
        if (convertedItems.length > 1) {
          const btnAll = document.createElement("button");
          btnAll.type = "button";
          btnAll.className = "btn btn-success btn-sm";
          btnAll.textContent = "Download All JPGs";
          btnAll.addEventListener("click", downloadAll);
          resultsHeader.appendChild(btnAll);

          const btnZip = document.createElement("button");
          btnZip.type = "button";
          btnZip.className = "btn btn-secondary btn-sm";
          btnZip.textContent = "Download as ZIP";
          btnZip.addEventListener("click", downloadZip);
          resultsHeader.appendChild(btnZip);
        }

        const btnRestart = document.createElement("button");
        btnRestart.type = "button";
        btnRestart.className = "btn btn-secondary btn-sm";
        btnRestart.textContent = "Start Over";
        btnRestart.addEventListener("click", startOver);
        resultsHeader.appendChild(btnRestart);

        // Cards
        convertedItems.forEach(function (item, idx) {
          const card = document.createElement("div");
          card.className = "card" + (item.error ? " error-card" : "");

          if (item.error) {
            const meta = document.createElement("div");
            meta.className = "card-meta";
            meta.innerHTML =
              "<div><strong>" + escapeHtml(item.name) + "</strong></div>" +
              "<div>" + escapeHtml(item.error) + "</div>";
            card.appendChild(meta);
          } else {
            const img = document.createElement("img");
            img.className = "card-preview";
            img.src = item.url;
            img.alt = "Converted preview";
            img.loading = "lazy";
            card.appendChild(img);

            const meta = document.createElement("div");
            meta.className = "card-meta";
            meta.innerHTML =
              "<div><strong>" + escapeHtml(item.name) + "</strong></div>" +
              "<div>Original: " + formatBytes(item.origSize) + "</div>" +
              "<div>JPG: " + formatBytes(item.jpgSize) + "</div>" +
              "<div style=\"color:var(--success);margin-top:0.3rem\">Conversion complete</div>";
            card.appendChild(meta);

            const actions = document.createElement("div");
            actions.className = "card-actions";
            const dlBtn = document.createElement("button");
            dlBtn.type = "button";
            dlBtn.className = "btn btn-primary btn-sm";
            dlBtn.textContent = "Download JPG";
            dlBtn.addEventListener("click", function () {
              downloadBlob(item.blob, item.name);
            });
            actions.appendChild(dlBtn);
            card.appendChild(actions);
          }

          cardsEl.appendChild(card);
        });
      }

      function escapeHtml(str) {
        const div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
      }

      // ---------- conversion ----------
      async function convertFile(file) {
        const result = {
          name: safeJpgName(file.name),
          origSize: file.size,
          blob: null,
          url: null,
          jpgSize: 0,
          error: null
        };

        try {
          if (typeof HeicTo === "undefined") {
            throw new Error("Conversion library failed to load. Please refresh the page.");
          }

          const jpegBlob = await HeicTo({
            blob: file,
            type: "image/jpeg",
            quality: 0.95
          });

          if (!jpegBlob || !(jpegBlob instanceof Blob)) {
            throw new Error("Conversion returned an invalid result.");
          }

          result.blob = jpegBlob;
          result.jpgSize = jpegBlob.size;
          result.url = URL.createObjectURL(jpegBlob);
        } catch (err) {
          console.error("Conversion error for", file.name, err);
          result.error = err && err.message ? err.message : "Conversion failed.";
        }

        return result;
      }

      async function processFiles(fileList) {
        if (isConverting) return;
        if (!fileList || fileList.length === 0) {
          setStatus("No files detected. Please try selecting again.", "error");
          return;
        }

        const files = Array.from(fileList).filter(function (f) {
          return isHeicByExtension(f.name);
        });

        if (files.length === 0) {
          setStatus("No HEIC/HEIF files found. Please select .heic or .heif files.", "error");
          console.warn("Selected files were not HEIC/HEIF by extension:", Array.from(fileList).map(function (f) { return f.name + " (" + f.type + ")"; }));
          return;
        }

        isConverting = true;
        selectBtn.disabled = true;
        revokeAllUrls();
        resultsEl.classList.remove("visible");
        cardsEl.innerHTML = "";
        resultsHeader.innerHTML = "";

        setStatus("Converting… (" + files.length + " file" + (files.length > 1 ? "s" : "") + ")", "loading");

        const results = [];
        for (let i = 0; i < files.length; i++) {
          setStatus("Converting… " + (i + 1) + " / " + files.length, "loading");
          const res = await convertFile(files[i]);
          results.push(res);
        }

        convertedItems = results;
        isConverting = false;
        selectBtn.disabled = false;

        const successCount = results.filter(function (r) { return !r.error; }).length;
        if (successCount === 0) {
          setStatus("All conversions failed. See details below.", "error");
        } else if (successCount < results.length) {
          setStatus("Converted " + successCount + " of " + results.length + " files.", "success");
        } else {
          setStatus("Conversion complete!", "success");
        }

        renderResults();
      }

      // ---------- downloads ----------
      function downloadAll() {
        convertedItems.forEach(function (item) {
          if (item.blob && !item.error) {
            downloadBlob(item.blob, item.name);
          }
        });
      }

      async function downloadZip() {
        if (typeof JSZip === "undefined") {
          setStatus("ZIP library failed to load.", "error");
          return;
        }
        try {
          setStatus("Creating ZIP…", "loading");
          const zip = new JSZip();
          convertedItems.forEach(function (item) {
            if (item.blob && !item.error) {
              zip.file(item.name, item.blob);
            }
          });
          const content = await zip.generateAsync({ type: "blob" });
          downloadBlob(content, "fexilo-converted.zip");
          setStatus("ZIP ready!", "success");
        } catch (err) {
          console.error("ZIP error:", err);
          setStatus("Failed to create ZIP.", "error");
        }
      }

      function startOver() {
        revokeAllUrls();
        resultsEl.classList.remove("visible");
        cardsEl.innerHTML = "";
        resultsHeader.innerHTML = "";
        setStatus("");
        // Critical: clear value so the same file can be selected again
        fileInput.value = "";
        selectBtn.disabled = false;
        isConverting = false;
      }

      // ---------- robust file selection ----------
      function handleFilesFromInput() {
        console.log("file input change/input fired, files:", fileInput.files ? fileInput.files.length : 0);
        if (fileInput.files && fileInput.files.length > 0) {
          processFiles(fileInput.files);
        } else {
          // Android sometimes fires change with empty list – show feedback
          setStatus("No files were detected. Please try again.", "error");
          console.warn("Change event fired but input.files is empty.");
        }
      }

      // Attach listeners ONCE – never re-attach
      fileInput.addEventListener("change", handleFilesFromInput);
      // Extra fallback for some Android browsers
      fileInput.addEventListener("input", handleFilesFromInput);

      selectBtn.addEventListener("click", function (e) {
        e.preventDefault();
        e.stopPropagation();
        if (isConverting) return;
        // Reset value so selecting the same file again still triggers change
        fileInput.value = "";
        fileInput.click();
      });

      // Optional drag-and-drop (desktop)
      uploadArea.addEventListener("dragover", function (e) {
        e.preventDefault();
        uploadArea.classList.add("dragover");
      });
      uploadArea.addEventListener("dragleave", function () {
        uploadArea.classList.remove("dragover");
      });
      uploadArea.addEventListener("drop", function (e) {
        e.preventDefault();
        uploadArea.classList.remove("dragover");
        if (isConverting) return;
        if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
          processFiles(e.dataTransfer.files);
        }
      });

      // Prevent accidental form submission if ever wrapped
      document.addEventListener("submit", function (e) {
        e.preventDefault();
      });

      console.log("Fexilo ready. HeicTo available:", typeof HeicTo !== "undefined", "JSZip available:", typeof JSZip !== "undefined");
    })();
  </script>
</body>
</html>
