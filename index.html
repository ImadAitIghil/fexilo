<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fexilo – Free HEIC to JPG Converter</title>

  <meta
    name="description"
    content="Convert HEIC and HEIF photos to JPG directly in your browser. Free, private and secure. No uploads."
  >

  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#4f46e5">

  <!-- HEIC / HEIF converter -->
  <script src="https://cdn.jsdelivr.net/npm/heic-to@1.5.2/dist/iife/heic-to.js"></script>

  <!-- ZIP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --success: #059669;
      --danger: #dc2626;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background: var(--bg);
      color: var(--text);
      min-height: 100vh;

      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 20px;
      text-align: center;
    }

    header h1 {
      color: var(--primary);
      font-size: 28px;
      font-weight: 800;
    }

    header p {
      color: var(--muted);
      font-size: 14px;
      margin-top: 5px;
    }

    main {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 25px 16px 50px;
      flex: 1;
    }

    .upload-box {
      border: 2px dashed #c7d2fe;
      background: #eef2ff;
      border-radius: var(--radius);
      padding: 50px 20px;
      text-align: center;
      transition: 0.2s;
    }

    .upload-box.dragover {
      border-color: var(--primary);
      background: #e0e7ff;
    }

    .upload-box h2 {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .upload-box p {
      color: var(--muted);
      font-size: 14px;
    }

    .select-button {
      margin-top: 20px;
    }

    input[type="file"] {
      display: none;
    }

    .btn {
      border: 0;
      border-radius: 9px;
      padding: 12px 18px;

      font-size: 15px;
      font-weight: 700;

      cursor: pointer;

      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;

      transition:
        background 0.15s,
        transform 0.1s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: white;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: #f3f4f6;
    }

    .results {
      display: none;
      margin-top: 25px;
    }

    .results.visible {
      display: block;
    }

    .results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .results-header h2 {
      font-size: 19px;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .file-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .file-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;

      display: flex;
      align-items: center;
      gap: 14px;
    }

    .preview {
      width: 82px;
      height: 82px;
      object-fit: cover;

      border-radius: 10px;
      background: #f3f4f6;

      flex-shrink: 0;
    }

    .file-info {
      flex: 1;
      min-width: 0;
    }

    .file-name {
      font-size: 14px;
      font-weight: 700;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-size {
      color: var(--muted);
      font-size: 12px;
      margin-top: 4px;
    }

    .status {
      font-size: 12px;
      margin-top: 5px;
    }

    .status.success {
      color: var(--success);
    }

    .status.error {
      color: var(--danger);
    }

    .file-action {
      flex-shrink: 0;
    }

    .privacy {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      margin-top: 28px;
      line-height: 1.5;
    }

    .privacy strong {
      color: var(--text);
    }

    footer {
      border-top: 1px solid var(--border);
      background: white;
      color: var(--muted);
      text-align: center;
      padding: 16px;
      font-size: 12px;
    }

    .loading {
      text-align: center;
    }

    .spinner {
      width: 30px;
      height: 30px;

      margin: 18px auto 0;

      border: 3px solid #c7d2fe;
      border-top-color: var(--primary);

      border-radius: 50%;

      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .error-box {
      display: none;

      margin-top: 18px;
      padding: 12px;

      border-radius: 10px;

      background: #fef2f2;
      border: 1px solid #fecaca;

      color: #991b1b;

      font-size: 13px;
    }

    .error-box.visible {
      display: block;
    }

    .success-box {
      display: none;

      margin-top: 18px;
      padding: 12px;

      border-radius: 10px;

      background: #ecfdf5;
      border: 1px solid #a7f3d0;

      color: #065f46;

      font-size: 13px;
    }

    .success-box.visible {
      display: block;
    }

    @media (max-width: 600px) {

      main {
        padding: 18px 12px 40px;
      }

      .upload-box {
        padding: 40px 15px;
      }

      .file-card {
        align-items: flex-start;
      }

      .preview {
        width: 70px;
        height: 70px;
      }

      .file-action .btn {
        padding: 9px 12px;
        font-size: 13px;
      }

      .actions {
        width: 100%;
      }

      .actions .btn {
        flex: 1;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Fexilo</h1>
  <p>Free private HEIC → JPG converter</p>
</header>


<main>

  <!-- UPLOAD -->

  <div
    class="upload-box"
    id="uploadBox"
  >

    <h2>
      Convert HEIC / HEIF to JPG
    </h2>

    <p>
      Select one or multiple photos
    </p>

    <label
      class="btn btn-primary select-button"
      for="fileInput"
    >
      Select Files
    </label>

    <input
      id="fileInput"
      type="file"
      accept=".heic,.heif,image/heic,image/heif"
      multiple
    >

    <div
      id="errorBox"
      class="error-box"
    ></div>

  </div>


  <!-- RESULTS -->

  <section
    class="results"
    id="results"
  >

    <div class="results-header">

      <h2 id="resultsTitle">
        Converted
      </h2>

      <div
        class="actions"
        id="actions"
      ></div>

    </div>


    <div
      class="file-list"
      id="fileList"
    ></div>


    <div
      style="
        text-align:center;
        margin-top:20px;
      "
    >

      <button
        type="button"
        class="btn btn-secondary"
        id="startOver"
      >
        Start Over
      </button>

    </div>

  </section>


  <p class="privacy">

    <strong>100% private.</strong>

    All conversion happens directly
    in your browser.

    <br>

    Your photos never leave your device.
    No uploads. No accounts.

  </p>

</main>


<footer>
  Fexilo • Free HEIC to JPG converter
</footer>


<script>

  // ==================================================
  // SETTINGS
  // ==================================================

  const QUALITY = 0.95;


  // ==================================================
  // ELEMENTS
  // ==================================================

  const uploadBox =
    document.getElementById("uploadBox");

  const fileInput =
    document.getElementById("fileInput");

  const results =
    document.getElementById("results");

  const resultsTitle =
    document.getElementById("resultsTitle");

  const actions =
    document.getElementById("actions");

  const fileList =
    document.getElementById("fileList");

  const startOver =
    document.getElementById("startOver");

  const errorBox =
    document.getElementById("errorBox");


  // ==================================================
  // STATE
  // ==================================================

  let convertedFiles = [];


  // ==================================================
  // FORMAT SIZE
  // ==================================================

  function formatBytes(bytes) {

    if (bytes < 1024) {
      return bytes + " B";
    }

    if (bytes < 1024 * 1024) {

      return (
        (bytes / 1024).toFixed(1)
        + " KB"
      );

    }

    return (
      (bytes / (1024 * 1024)).toFixed(2)
      + " MB"
    );
  }


  // ==================================================
  // JPG NAME
  // ==================================================

  function getJpgName(name) {

    return name.replace(
      /\.(heic|heif)$/i,
      ".jpg"
    );

  }


  // ==================================================
  // SHOW ERROR
  // ==================================================

  function showError(message) {

    errorBox.textContent = message;

    errorBox.classList.add(
      "visible"
    );

  }


  function hideError() {

    errorBox.textContent = "";

    errorBox.classList.remove(
      "visible"
    );

  }


  // ==================================================
  // FILE INPUT
  // ==================================================

  fileInput.addEventListener(
    "change",
    async function () {

      if (
        this.files &&
        this.files.length > 0
      ) {

        await processFiles(
          Array.from(this.files)
        );

      }

    }
  );


  // ==================================================
  // DRAG & DROP
  // ==================================================

  uploadBox.addEventListener(
    "dragover",
    function (event) {

      event.preventDefault();

      uploadBox.classList.add(
        "dragover"
      );

    }
  );


  uploadBox.addEventListener(
    "dragleave",
    function () {

      uploadBox.classList.remove(
        "dragover"
      );

    }
  );


  uploadBox.addEventListener(
    "drop",
    async function (event) {

      event.preventDefault();

      uploadBox.classList.remove(
        "dragover"
      );


      if (
        event.dataTransfer &&
        event.dataTransfer.files.length
      ) {

        await processFiles(
          Array.from(
            event.dataTransfer.files
          )
        );

      }

    }
  );


  // ==================================================
  // PROCESS FILES
  // ==================================================

  async function processFiles(files) {

    hideError();


    const heicFiles =
      files.filter(
        file => {

          const name =
            file.name.toLowerCase();

          return (
            name.endsWith(".heic") ||
            name.endsWith(".heif")
          );

        }
      );


    if (heicFiles.length === 0) {

      showError(
        "No HEIC or HEIF files were selected."
      );

      return;

    }


    // Check library

    if (
      typeof window.HeicTo !== "function"
    ) {

      showError(
        "The HEIC converter library did not load. Please check your internet connection and reload the page."
      );

      return;

    }


    // Loading screen

    uploadBox.innerHTML = `

      <div class="loading">

        <h2>
          Converting...
        </h2>

        <p>
          Please wait while Fexilo converts your photos.
        </p>

        <div class="spinner"></div>

      </div>

    `;


    convertedFiles = [];


    // Convert one by one

    for (
      const file of heicFiles
    ) {

      const result =
        await convertFile(file);

      convertedFiles.push(result);

    }


    showResults();

  }


  // ==================================================
  // CONVERT ONE FILE
  // ==================================================

  async function convertFile(file) {

    console.log(
      "Fexilo: converting",
      file.name,
      file.type,
      file.size
    );


    try {

      /*
       * The official IIFE API exposes
       * the converter as window.HeicTo.
       */

      const jpgBlob =
        await window.HeicTo({

          blob: file,

          type: "image/jpeg",

          quality: QUALITY

        });


      if (
        !jpgBlob ||
        jpgBlob.size === 0
      ) {

        throw new Error(
          "The converter returned an empty JPG."
        );

      }


      const url =
        URL.createObjectURL(
          jpgBlob
        );


      return {

        originalName:
          file.name,

        jpgName:
          getJpgName(file.name),

        originalSize:
          file.size,

        convertedSize:
          jpgBlob.size,

        blob:
          jpgBlob,

        url:
          url,

        error:
          null

      };


    } catch (error) {

      console.error(
        "Fexilo conversion error:",
        error
      );


      return {

        originalName:
          file.name,

        jpgName:
          getJpgName(file.name),

        originalSize:
          file.size,

        convertedSize:
          0,

        blob:
          null,

        url:
          null,

        error:
          error &&
          error.message
            ? error.message
            : "Conversion failed."

      };

    }

  }


  // ==================================================
  // SHOW RESULTS
  // ==================================================

  function showResults() {

    uploadBox.style.display =
      "none";

    results.classList.add(
      "visible"
    );


    renderFileList();

    renderActions();

  }


  // ==================================================
  // FILE LIST
  // ==================================================

  function renderFileList() {

    fileList.innerHTML = "";


    convertedFiles.forEach(
      (file, index) => {

        const card =
          document.createElement(
            "div"
          );

        card.className =
          "file-card";


        // IMAGE

        const img =
          document.createElement(
            "img"
          );

        img.className =
          "preview";

        img.alt =
          file.jpgName;


        if (file.url) {

          img.src =
            file.url;

        }


        // INFO

        const info =
          document.createElement(
            "div"
          );

        info.className =
          "file-info";


        const name =
          document.createElement(
            "div"
          );

        name.className =
          "file-name";

        name.textContent =
          file.jpgName;


        const size =
          document.createElement(
            "div"
          );

        size.className =
          "file-size";


        if (file.blob) {

          size.textContent =
            formatBytes(
              file.originalSize
            )
            +
            " → "
            +
            formatBytes(
              file.convertedSize
            );

        }


        const status =
          document.createElement(
            "div"
          );


        status.className =
          file.error
            ? "status error"
            : "status success";


        status.textContent =
          file.error
            ? "Error: " + file.error
            : "Conversion complete";


        info.appendChild(name);

        info.appendChild(size);

        info.appendChild(status);


        // BUTTON

        const action =
          document.createElement(
            "div"
          );

        action.className =
          "file-action";


        if (file.blob) {

          const button =
            document.createElement(
              "button"
            );

          button.type =
            "button";

          button.className =
            "btn btn-primary";

          button.textContent =
            "Download JPG";


          button.onclick =
            function () {

              downloadFile(
                file.blob,
                file.jpgName
              );

            };


          action.appendChild(
            button
          );

        }


        card.appendChild(img);

        card.appendChild(info);

        card.appendChild(action);


        fileList.appendChild(card);

      }
    );


    const successful =
      convertedFiles.filter(
        file => file.blob
      );


    resultsTitle.textContent =
      successful.length === 1
        ? "1 file converted"
        : successful.length +
          " files converted";

  }


  // ==================================================
  // TOP ACTIONS
  // ==================================================

  function renderActions() {

    actions.innerHTML = "";


    const successful =
      convertedFiles.filter(
        file => file.blob
      );


    if (
      successful.length === 0
    ) {

      return;

    }


    // ONE FILE

    if (
      successful.length === 1
    ) {

      const button =
        document.createElement(
          "button"
        );

      button.type =
        "button";

      button.className =
        "btn btn-primary";

      button.textContent =
        "Download JPG";


      button.onclick =
        function () {

          downloadFile(
            successful[0].blob,
            successful[0].jpgName
          );

        };


      actions.appendChild(
        button
      );

      return;

    }


    // MULTIPLE FILES

    const allButton =
      document.createElement(
        "button"
      );

    allButton.type =
      "button";

    allButton.className =
      "btn btn-primary";

    allButton.textContent =
      "Download All JPGs (" +
      successful.length +
      ")";


    allButton.onclick =
      function () {

        downloadAll(
          successful
        );

      };


    actions.appendChild(
      allButton
    );


    // ZIP

    const zipButton =
      document.createElement(
        "button"
      );

    zipButton.type =
      "button";

    zipButton.className =
      "btn btn-secondary";

    zipButton.textContent =
      "Download as ZIP";


    zipButton.onclick =
      function () {

        downloadZip(
          successful
        );

      };


    actions.appendChild(
      zipButton
    );

  }


  // ==================================================
  // DOWNLOAD SINGLE
  // ==================================================

  function downloadFile(
    blob,
    filename
  ) {

    if (!blob) {
      return;
    }


    const url =
      URL.createObjectURL(
        blob
      );


    const link =
      document.createElement(
        "a"
      );


    link.href =
      url;

    link.download =
      filename;

    link.style.display =
      "none";


    document.body.appendChild(
      link
    );


    link.click();


    setTimeout(
      function () {

        link.remove();

        URL.revokeObjectURL(
          url
        );

      },
      1500
    );

  }


  // ==================================================
  // DOWNLOAD ALL
  // ==================================================

  async function downloadAll(
    files
  ) {

    for (
      let i = 0;
      i < files.length;
      i++
    ) {

      downloadFile(
        files[i].blob,
        files[i].jpgName
      );


      if (
        i < files.length - 1
      ) {

        await new Promise(
          resolve =>
            setTimeout(
              resolve,
              800
            )
        )
