<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fexilo – HEIC to JPG</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #0f1115;
  --card: #1a1d24;
  --card2: #232731;
  --border: #303540;
  --text: #f1f3f5;
  --muted: #9da3ad;
  --blue: #4f8cff;
  --blue2: #3b78e7;
  --green: #34c759;
  --red: #ff453a;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
  min-height: 100vh;
}

header {
  text-align: center;
  padding: 25px 15px;
  background: var(--card);
  border-bottom: 1px solid var(--border);
}

.logo {
  font-size: 32px;
  font-weight: 800;
}

.logo span {
  color: var(--blue);
}

.subtitle {
  color: var(--muted);
  margin-top: 5px;
  font-size: 14px;
}

main {
  width: 100%;
  max-width: 700px;
  margin: auto;
  padding: 20px 15px 50px;
}

.privacy {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 15px;
  text-align: center;
  color: var(--muted);
  font-size: 14px;
  margin-bottom: 20px;
}

.privacy strong {
  color: var(--green);
}

.upload-box {
  background: var(--card);
  border: 2px dashed var(--border);
  border-radius: 16px;
  padding: 45px 20px;
  text-align: center;
  transition: 0.2s;
}

.upload-box.drag {
  border-color: var(--blue);
  background: rgba(79,140,255,0.08);
}

.icon {
  font-size: 50px;
  margin-bottom: 15px;
}

.upload-title {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 7px;
}

.upload-description {
  color: var(--muted);
  font-size: 14px;
  margin-bottom: 20px;
}

button {
  border: 0;
  border-radius: 10px;
  padding: 13px 20px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  color: white;
  background: var(--blue);
  transition: 0.15s;
}

button:hover {
  background: var(--blue2);
}

button:active {
  transform: scale(0.97);
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.secondary {
  background: var(--card2);
  border: 1px solid var(--border);
}

.secondary:hover {
  background: #303540;
}

.green {
  background: var(--green);
}

.green:hover {
  background: #28ad4b;
}

#fileInput {
  display: none;
}

.status {
  text-align: center;
  margin: 20px 0;
  min-height: 25px;
  font-size: 15px;
}

.status.loading {
  color: var(--blue);
}

.status.success {
  color: var(--green);
}

.status.error {
  color: var(--red);
}

.spinner {
  display: inline-block;
  width: 16px;
  height: 16px;
  border: 2px solid rgba(79,140,255,0.3);
  border-top-color: var(--blue);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  vertical-align: -3px;
  margin-right: 7px;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

.results {
  display: none;
}

.results.show {
  display: block;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  margin-bottom: 20px;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 15px;
  padding: 15px;
  margin-bottom: 15px;
}

.preview {
  width: 100%;
  max-height: 400px;
  object-fit: contain;
  background: #000;
  border-radius: 10px;
  display: block;
  margin-bottom: 15px;
}

.info {
  color: var(--muted);
  font-size: 14px;
  line-height: 1.7;
  margin-bottom: 12px;
}

.info strong {
  color: white;
}

.card-buttons {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.error {
  border-color: var(--red);
  color: var(--red);
  padding: 15px;
}

footer {
  text-align: center;
  color: var(--muted);
  font-size: 12px;
  padding: 25px 10px;
  border-top: 1px solid var(--border);
}

@media(max-width: 500px) {
  main {
    padding: 15px 10px 40px;
  }

  .upload-box {
    padding: 35px 15px;
  }

  .actions button,
  .card-buttons button {
    flex: 1;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">Fex<span>ilo</span></div>
  <div class="subtitle">
    Private HEIC / HEIF → JPG Converter
  </div>
</header>

<main>

  <div class="privacy">
    <strong>100% Private</strong><br>
    Your photos are processed directly in your browser.
    Nothing is uploaded to a server.
  </div>

  <div class="upload-box" id="uploadBox">

    <div class="icon">📷</div>

    <div class="upload-title">
      Convert HEIC to JPG
    </div>

    <div class="upload-description">
      Select one or multiple HEIC / HEIF photos
    </div>

    <button id="selectButton" type="button">
      Select Photos
    </button>

  </div>

  <input
    id="fileInput"
    type="file"
    multiple
    accept=".heic,.heif,image/heic,image/heif"
  >

  <div id="status" class="status"></div>

  <div id="results" class="results">

    <div id="actions" class="actions"></div>

    <div id="cards"></div>

  </div>

</main>

<footer>
  Fexilo · Client-side conversion · No uploads
</footer>


<!-- HEIC CONVERTER -->
<script src="https://cdn.jsdelivr.net/npm/heic-to@1.5.2/dist/iife/heic-to.js"></script>

<!-- ZIP -->
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>


<script>
(function () {

"use strict";


/* =========================
   ELEMENTS
========================= */

const fileInput = document.getElementById("fileInput");
const selectButton = document.getElementById("selectButton");
const uploadBox = document.getElementById("uploadBox");
const status = document.getElementById("status");
const results = document.getElementById("results");
const actions = document.getElementById("actions");
const cards = document.getElementById("cards");


/* =========================
   VARIABLES
========================= */

let converted = [];
let converting = false;


/* =========================
   STATUS
========================= */

function showStatus(text, type) {

  status.innerHTML = "";
  status.className = "status";

  if (!text) {
    return;
  }

  if (type === "loading") {

    status.classList.add("loading");

    const spinner = document.createElement("span");
    spinner.className = "spinner";

    status.appendChild(spinner);
    status.appendChild(
      document.createTextNode(text)
    );

  } else {

    if (type) {
      status.classList.add(type);
    }

    status.textContent = text;
  }
}


/* =========================
   FILE HELPERS
========================= */

function isHEIC(file) {

  if (!file || !file.name) {
    return false;
  }

  const name = file.name.toLowerCase();

  return (
    name.endsWith(".heic") ||
    name.endsWith(".heif")
  );
}


function jpgName(name) {

  return name.replace(
    /\.(heic|heif)$/i,
    ".jpg"
  );
}


function formatSize(bytes) {

  if (!bytes) {
    return "0 B";
  }

  const units = [
    "B",
    "KB",
    "MB",
    "GB"
  ];

  const index =
    Math.floor(
      Math.log(bytes) /
      Math.log(1024)
    );

  return (
    (bytes /
      Math.pow(1024, index))
      .toFixed(index === 0 ? 0 : 1)
    + " " +
    units[index]
  );
}


/* =========================
   CLEAN OLD RESULTS
========================= */

function clearResults() {

  converted.forEach(function(item) {

    if (item.url) {

      try {
        URL.revokeObjectURL(item.url);
      } catch (e) {}

    }

  });

  converted = [];

  cards.innerHTML = "";
  actions.innerHTML = "";

  results.classList.remove("show");
}


/* =========================
   OPEN FILE PICKER
========================= */

selectButton.addEventListener(
  "click",
  function () {

    if (converting) {
      return;
    }

    /*
      VERY IMPORTANT:
      Clearing value allows selecting
      the same photo again.
    */

    fileInput.value = "";

    fileInput.click();

  }
);


/* =========================
   FILE CHANGE
========================= */

fileInput.addEventListener(
  "change",
  function () {

    console.log(
      "Files selected:",
      fileInput.files
        ? fileInput.files.length
        : 0
    );

    if (
      !fileInput.files ||
      fileInput.files.length === 0
    ) {

      showStatus(
        "No files selected.",
        "error"
      );

      return;
    }

    handleFiles(fileInput.files);

  }
);


/* =========================
   HANDLE FILES
========================= */

async function handleFiles(fileList) {

  if (converting) {
    return;
  }

  const allFiles =
    Array.from(fileList);

  console.log(
    "Selected files:",
    allFiles
  );


  /*
    Do NOT rely on MIME type.
    Android/iPhone can return weird
    MIME types for HEIC.
  */

  const heicFiles =
    allFiles.filter(function(file) {

      return isHEIC(file);

    });


  if (heicFiles.length === 0) {

    showStatus(
      "The selected files are not HEIC/HEIF.",
      "error"
    );

    return;
  }


  converting = true;

  selectButton.disabled = true;

  clearResults();


  showStatus(
    "Preparing " +
    heicFiles.length +
    " photo(s)...",
    "loading"
  );


  const resultsArray = [];


  for (
    let i = 0;
    i < heicFiles.length;
    i++
  ) {

    const file =
      heicFiles[i];


    showStatus(
      "Converting " +
      (i + 1) +
      " / " +
      heicFiles.length,
      "loading"
    );


    try {

      const result =
        await convertHEIC(file);

      resultsArray.push(result);

    } catch (error) {

      console.error(
        "Conversion failed:",
        error
      );

      resultsArray.push({

        originalName: file.name,

        name: jpgName(file.name),

        originalSize: file.size,

        error:
          error &&
          error.message
            ? error.message
            : "Conversion failed."

      });

    }

  }


  converted =
    resultsArray;


  converting = false;

  selectButton.disabled = false;


  const success =
    converted.filter(
      function(item) {
        return !item.error;
      }
    ).length;


  if (success === converted.length) {

    showStatus(
      "✓ " +
      success +
      " photo(s) converted successfully!",
      "success"
    );

  } else if (success > 0) {

    showStatus(
      "Converted " +
      success +
      " of " +
      converted.length +
      " photos.",
      "success"
    );

  } else {

    showStatus(
      "Conversion failed. Check the error below.",
      "error"
    );

  }


  render();

}


/* =========================
   CONVERT HEIC
========================= */

function convertHEIC(file) {

  return new Promise(
    function(resolve, reject) {

      if (
        typeof HeicTo ===
        "undefined"
      ) {

        reject(
          new Error(
            "HEIC converter library did not load. Check your internet connection and refresh the page."
          )
        );

        return;
      }


      console.log(
        "Converting:",
        file.name,
        file.type,
        file.size
      );


      HeicTo({

        blob: file,

        type: "image/jpeg",

        quality: 0.92

      })

      .then(
        function(blob) {

          console.log(
            "Converted:",
            file.name,
            blob
          );


          if (
            !blob ||
            !(blob instanceof Blob)
          ) {

            reject(
              new Error(
                "The converter returned an invalid image."
              )
            );

            return;
          }


          const url =
            URL.createObjectURL(blob);


          resolve({

            originalName:
              file.name,

            name:
              jpgName(file.name),

            originalSize:
              file.size,

            jpgSize:
              blob.size,

            blob:
              blob,

            url:
              url,

            error:
              null

          });

        }
      )

      .catch(
        function(error) {

          reject(error);

        }
      );

    }
  );

}


/* =========================
   RENDER RESULTS
========================= */

function render() {

  cards.innerHTML = "";
  actions.innerHTML = "";


  if (
    !converted ||
    converted.length === 0
  ) {

    results.classList.remove("show");

    return;
  }


  results.classList.add("show");


  /*
    START OVER
  */

  const restart =
    document.createElement("button");

  restart.className =
    "secondary";

  restart.textContent =
    "Start Over";

  restart.onclick =
    startOver;

  actions.appendChild(
    restart
  );


  /*
    DOWNLOAD ALL
  */

  const successful =
    converted.filter(
      function(item) {
        return (
          item.blob &&
          !item.error
        );
      }
    );


  if (successful.length > 1) {

    const downloadAll =
      document.createElement("button");

    downloadAll.className =
      "green";

    downloadAll.textContent =
      "Download All JPGs";

    downloadAll.onclick =
      downloadAllFiles;

    actions.appendChild(
      downloadAll
    );


    /*
      ZIP
    */

    const zipButton =
      document.createElement("button");

    zipButton.className =
      "secondary";

    zipButton.textContent =
      "Download ZIP";

    zipButton.onclick =
      downloadZIP;

    actions.appendChild(
      zipButton
    );

  }


  /*
    CARDS
  */

  converted.forEach(
    function(item) {

      const card =
        document.createElement("div");

      card.className =
        "card";


      /*
        ERROR
      */

      if (item.error) {

        card.innerHTML =

          '<div class="error">' +

          "<strong>" +
          escapeHTML(item.name) +
          "</strong><br><br>" +

          escapeHTML(item.error) +

          "</div>";

        cards.appendChild(card);

        return;
      }


      /*
        IMAGE
      */

      const image =
        document.createElement("img");

      image.className =
        "preview";

      image.src =
        item.url;

      image.alt =
        item.name;


      /*
        INFO
      */

      const info =
        document.createElement("div");

      info.className =
        "info";

      info.innerHTML =

        "<div><strong>" +
        escapeHTML(item.name) +
        "</strong></div>" +

        "<div>Original: " +
        formatSize(
          item.originalSize
        ) +
        "</div>" +

        "<div>JPG: " +
        formatSize(
          item.jpgSize
        ) +
        "</div>" +

        '<div style="color:#34c759">' +
        "✓ Conversion complete" +
        "</div>";


      /*
        BUTTONS
      */

      const buttonArea =
        document.createElement("div");

      buttonArea.className =
        "card-buttons";


      const download =
        document.createElement("button");

      download.textContent =
        "Download JPG";

      download.onclick =
        function() {

          downloadBlob(
            item.blob,
            item.name
          );

        };


      buttonArea.appendChild(
        download
      );


      card.appendChild(image);

      card.appendChild(info);

      card.appendChild(
        buttonArea
      );


      cards.appendChild(card);

    }
  );

}


/* =========================
   DOWNLOAD ONE
========================= */

function downloadBlob(
  blob,
  filename
) {

  if (!blob) {
    return;
  }


  const url =
    URL.createObjectURL(blob);


  const link =
    document.createElement("a");

  link.href =
    url;

  link.download =
    filename;

  link.style.display =
    "none";


  document.body.appendChild(
    link
  );


  link.click();


  setTimeout(
    function() {

      document.body.removeChild(
        link
      );

      URL.revokeObjectURL(
        url
      );

    },
    1000
  );

}


/* =========================
   DOWNLOAD ALL
========================= */

function downloadAllFiles() {

  const files =
    converted.filter(
      function(item) {

        return (
          item.blob &&
          !item.error
        );

      }
    );


  files.forEach(
    function(item, index) {

      /*
        Small delay between downloads
        because some mobile browsers
        block many downloads at once.
      */

      setTimeout(
        function() {

          downloadBlob(
            item.blob,
            item.name
          );

        },
        index * 500
      );

    }
  );

}


/* =========================
   ZIP
========================= */

async function downloadZIP() {

  if (
    typeof JSZip ===
    "undefined"
  ) {

    showStatus(
      "ZIP library failed to load.",
      "error"
    );

    return;
  }


  try {

    showStatus(
      "Creating ZIP...",
      "loading"
    );


    const zip =
      new JSZip();


    converted.forEach(
      function(item) {

        if (
          item.blob &&
          !item.error
        ) {

          zip.file(
            item.name,
            item.blob
          );

        }

      }
    );


    const blob =
      await zip.generateAsync({
        type: "blob"
      });


    downloadBlob(
      blob,
      "fexilo-converted.zip"
    );


    showStatus(
      "✓ ZIP downloaded!",
      "success"
    );


  } catch (error) {

    console.error(
      "ZIP error:",
      error
    );

    showStatus(
      "Could not create ZIP.",
      "error"
    );

  }

}


/* =========================
   START OVER
========================= */

function startOver() {

  clearResults();

  fileInput.value = "";

  showStatus("");

  selectButton.disabled =
    false;

  converting =
    false;

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value) {

  const div =
    document.createElement("div");

  div.textContent =
    String(value || "");

  return div.innerHTML;

}


/* =========================
   DRAG & DROP
========================= */

uploadBox.addEventListener(
  "dragover",
  function(event) {

    event.preventDefault();

    uploadBox.classList.add(
      "drag"
    );

  }
);


uploadBox.addEventListener(
  "dragleave",
  function() {

    uploadBox.classList.remove(
      "drag"
    );

  }
);


uploadBox.addEventListener(
  "drop",
  function(event) {

    event.preventDefault();

    uploadBox.classList.remove(
      "drag"
    );


    if (
      event.dataTransfer &&
      event.dataTransfer.files
    ) {

      handleFiles(
        event.dataTransfer.files
      );

    }

  }
);


/* =========================
   DEBUG
========================= */

console.log(
  "Fexilo loaded."
);

console.log(
  "HeicTo:",
  typeof HeicTo
);

console.log(
  "JSZip:",
  typeof JSZip
);

})();
</script>

</body>
  </html>
